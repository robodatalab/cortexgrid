name: cortexflow tests

on:
  pull_request:
    paths:
      - "cortexflow/**"
      - "tests/unit/cortexflow/**"
      - "pyproject.toml"
      - ".github/workflows/cortexflow-tests.yml"

jobs:
  test:
    runs-on: arc-runners

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Run tests
        run: uv run python -m unittest discover -s tests/unit/cortexflow -v
