name: cortexflow tests

on:
  push:
    paths:
      - "cortexflow/**"
      - "tests/cortexflow_tests/**"
      - "pyproject.toml"
      - ".github/workflows/cortexflow-tests.yml"
  pull_request:
    paths:
      - "cortexflow/**"
      - "tests/cortexflow_tests/**"
      - "pyproject.toml"
      - ".github/workflows/cortexflow-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Run tests
        run: uv run python -m unittest discover -s tests/cortexflow_tests -v
