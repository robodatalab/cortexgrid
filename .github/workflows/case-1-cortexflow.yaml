name: case-1-cortexflow

on:
  pull_request:
    paths:
      - "cortexflow/**"

permissions:
  contents: write
  packages: write

concurrency:
  group: case-1-cortexflow-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test-cortexflow:
    runs-on: arc-runners
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv run python -m unittest discover -s tests/unit/cortexflow -v

  test-cortexflow-ui-backend:
    runs-on: arc-runners
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --group dev --group ui
      - env:
          PYTHONPATH: cortexflow_ui/backend
        run: uv run python -m unittest discover -s tests/unit/cortexflow_ui/backend -v

  test-jobs-control-plane:
    runs-on: arc-runners
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv run python -m unittest discover -s tests/unit/jobs_control_plane -v

  build-cortexflow-ui-backend:
    needs: [test-cortexflow, test-cortexflow-ui-backend]
    runs-on: arc-runners
    outputs:
      tag: ${{ steps.t.outputs.value }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/cortexflow-ui-backend
    steps:
      - uses: actions/checkout@v4
      - id: t
        run: echo "value=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: exists
        run: |
          if docker manifest inspect "$IMAGE:${{ steps.t.outputs.value }}" >/dev/null 2>&1; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.exists.outputs.value != 'true'
        run: |
          for attempt in 1 2 3; do
            if docker buildx build --platform linux/amd64 \
              -f k8s/docker/cortexflow-ui/backend/Dockerfile \
              -t "$IMAGE:${{ steps.t.outputs.value }}" \
              --push .; then
              exit 0
            fi
            echo "build attempt $attempt failed"
            sleep 10
          done
          exit 1

  build-jobs-control-plane:
    needs: [test-cortexflow, test-jobs-control-plane]
    runs-on: arc-runners
    outputs:
      tag: ${{ steps.t.outputs.value }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/jobs-control-plane
    steps:
      - uses: actions/checkout@v4
      - id: t
        run: echo "value=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: exists
        run: |
          if docker manifest inspect "$IMAGE:${{ steps.t.outputs.value }}" >/dev/null 2>&1; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.exists.outputs.value != 'true'
        run: |
          for attempt in 1 2 3; do
            if docker buildx build --platform linux/amd64 \
              -f k8s/docker/jobs-control-plane/Dockerfile \
              -t "$IMAGE:${{ steps.t.outputs.value }}" \
              --push .; then
              exit 0
            fi
            echo "build attempt $attempt failed"
            sleep 10
          done
          exit 1

  bump:
    needs: [build-cortexflow-ui-backend, build-jobs-control-plane]
    runs-on: arc-runners
    env:
      OWNER: ${{ github.repository_owner }}
      BRANCH: ${{ github.head_ref }}
      UI_BACKEND_TAG: ${{ needs.build-cortexflow-ui-backend.outputs.tag }}
      JCP_TAG: ${{ needs.build-jobs-control-plane.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "$BRANCH" main
          git reset --hard "origin/$BRANCH"

          NEW_IMAGE="ghcr.io/$OWNER/cortexflow-ui-backend:$UI_BACKEND_TAG" \
            yq -i '.spec.template.spec.containers[0].image = strenv(NEW_IMAGE)' k8s/workloads/cortexflow-ui/deployment-backend.yaml

          NEW_IMAGE="ghcr.io/$OWNER/jobs-control-plane:$JCP_TAG" \
            yq -i '.spec.template.spec.containers[0].image = strenv(NEW_IMAGE)' k8s/workloads/jobs-control-plane/deployment.yaml

          MAIN_VERSION=$(git show origin/main:pyproject.toml | grep -E '^version = ' | head -1 | sed -E 's/version = "([^"]+)"/\1/')
          CURRENT=$(grep -E '^version = ' pyproject.toml | head -1 | sed -E 's/version = "([^"]+)"/\1/')
          if [ "$CURRENT" = "$MAIN_VERSION" ]; then
            MAJOR=$(echo "$CURRENT" | cut -d. -f1)
            MINOR=$(echo "$CURRENT" | cut -d. -f2)
            PATCH=$(echo "$CURRENT" | cut -d. -f3)
            NEW="$MAJOR.$MINOR.$((PATCH+1))"
            sed -i -E "s/^version = \"$CURRENT\"/version = \"$NEW\"/" pyproject.toml
          fi

          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "bump cortexflow-ui-backend, jobs-control-plane, cortexflow library version"
          git push origin "HEAD:refs/heads/$BRANCH"
