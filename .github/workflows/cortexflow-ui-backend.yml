name: cortexflow-ui-backend

on:
  pull_request:
    paths:
      - "cortexflow/**"
      - "cortexflow_ui/backend/**"
      - "pyproject.toml"
      - ".github/workflows/cortexflow-ui-backend.yml"
      - "k8s/docker/cortexflow-ui/backend/**"

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: arc-runners

    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/cortexflow-ui-backend

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute branch slug
        id: slug
        run: echo "value=$(echo '${{ github.head_ref }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        env:
          NEW_TAG: ${{ steps.slug.outputs.value }}-${{ github.event.pull_request.head.sha }}
        run: |
          docker buildx build --platform linux/amd64 \
            -f k8s/docker/cortexflow-ui/backend/Dockerfile \
            -t "$IMAGE:$NEW_TAG" \
            --push .

      - name: Bump image tag in git
        env:
          NEW_TAG: ${{ steps.slug.outputs.value }}-${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.head_ref }}
        working-directory: k8s/workloads/cortexflow-ui
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            NEW_IMAGE="$IMAGE:$NEW_TAG" yq -i '.spec.template.spec.containers[0].image = strenv(NEW_IMAGE)' deployment-backend.yaml
            git add deployment-backend.yaml
            git diff --cached --quiet && exit 0
            git commit -m "bump cortexflow-ui-backend to $NEW_TAG"
            git push origin "HEAD:refs/heads/$BRANCH" && exit 0
            sleep 3
          done
          exit 1
