name: cortexflow-ui-backend

on:
  push:
    paths:
      - "cortexflow/**"
      - "cortexflow_ui/backend/**"
      - "pyproject.toml"
      - ".github/workflows/cortexflow-ui-backend.yml"
      - "k8s/docker/cortexflow-ui/backend/**"
  pull_request:
    paths:
      - "cortexflow/**"
      - "cortexflow_ui/backend/**"
      - "pyproject.toml"
      - ".github/workflows/cortexflow-ui-backend.yml"
      - "k8s/docker/cortexflow-ui/backend/**"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/cortexflow-ui-backend

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute branch slug
        id: slug
        run: echo "value=$(echo '${{ github.ref_name }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        run: |
          docker buildx build --platform linux/amd64 \
            -f k8s/docker/cortexflow-ui/backend/Dockerfile \
            -t $IMAGE:${{ steps.slug.outputs.value }}-${{ github.sha }} \
            --push .
