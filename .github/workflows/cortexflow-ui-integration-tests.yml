name: cortexflow-ui integration tests

on:
  repository_dispatch:
    types: [cortexflow-ui-stack-deployed]

concurrency:
  group: cortexflow-ui-integration-${{ github.event.client_payload.revision }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ github.event.client_payload.aws_role_arn }}
          aws-region: eu-west-2

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Install Playwright browser
        run: uv run playwright install chromium --with-deps

      - name: Run integration tests
        run: uv run python -m unittest discover -s tests/integration/cortexflow_ui -t . -v
