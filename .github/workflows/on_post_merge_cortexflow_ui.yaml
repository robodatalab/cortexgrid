name: on_post_merge_cortexflow_ui

on:
    push:
        branches: [main]
        paths:
            - "k8s/workloads/cortexflow_integration_tests/job.yaml"
            - "k8s/workloads/cortexflow/kustomization.yaml"
            - "k8s/workloads/cortexflow_ui/kustomization.yaml"
            - "k8s/workloads/cortexflow_ui_integration_tests/job.yaml"
            - "k8s/workloads/arc_runner_set/**"
            - ".github/workflows/on_post_merge_cortexflow_ui.yaml"

concurrency:
    group: cortexflow-ui-integration
    cancel-in-progress: false

permissions:
    contents: write

jobs:
    wait_for_cortexflow_deployment:
        runs-on: arc-runners
        steps:
            - run: |
                  kubectl annotate -n argocd app cortexflow argocd.argoproj.io/refresh=normal --overwrite
                  kubectl wait -n argocd app/cortexflow --for=jsonpath='{.status.sync.revision}'=$GITHUB_SHA --timeout=600s
                  kubectl wait -n argocd app/cortexflow --for=jsonpath='{.status.sync.status}'=Synced --timeout=600s
                  kubectl wait -n argocd app/cortexflow --for=jsonpath='{.status.health.status}'=Healthy --timeout=600s

    wait_for_cortexflow_ui_deployment:
        runs-on: arc-runners
        steps:
            - run: |
                  kubectl annotate -n argocd app cortexflow-ui argocd.argoproj.io/refresh=normal --overwrite
                  kubectl wait -n argocd app/cortexflow-ui --for=jsonpath='{.status.sync.revision}'=$GITHUB_SHA --timeout=600s
                  kubectl wait -n argocd app/cortexflow-ui --for=jsonpath='{.status.sync.status}'=Synced --timeout=600s
                  kubectl wait -n argocd app/cortexflow-ui --for=jsonpath='{.status.health.status}'=Healthy --timeout=600s

    test_cortexflow_ui_integration:
        needs:
            [wait_for_cortexflow_deployment, wait_for_cortexflow_ui_deployment]
        runs-on: arc-runners
        steps:
            - uses: actions/checkout@v4
            - run: |
                  kubectl delete -n cortexflow job/cortexflow-ui-integration-tests --ignore-not-found --wait=true
                  kubectl apply -f k8s/workloads/cortexflow_ui_integration_tests/job.yaml
                  kubectl wait -n cortexflow --for=condition=ready pod -l job-name=cortexflow-ui-integration-tests --timeout=120s
                  kubectl logs -n cortexflow -f job/cortexflow-ui-integration-tests &
                  kubectl wait -n cortexflow --for=condition=complete --timeout=15m job/cortexflow-ui-integration-tests

    report:
        needs: test_cortexflow_ui_integration
        if: always()
        runs-on: arc-runners
        concurrency:
            group: badges-push
            cancel-in-progress: false
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: badges
            - env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RESULT: ${{ needs.test_cortexflow_ui_integration.result }}
              run: |
                  if [ "$RESULT" = "skipped" ] || [ "$RESULT" = "cancelled" ]; then
                      exit 0
                  fi
                  if [ "$RESULT" = "success" ]; then
                      msg=passing
                      color=brightgreen
                  else
                      msg=failing
                      color=red
                  fi
                  mkdir -p badges
                  jq -n --arg l "ui integration" --arg m "$msg" --arg c "$color" \
                      '{schemaVersion:1, label:$l, message:$m, color:$c}' > badges/test_cortexflow_ui_integration.json
                  git config user.name  "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add badges
                  if git diff --cached --quiet; then
                      exit 0
                  fi
                  git commit -m "update ui integration badge"
                  git push origin badges
