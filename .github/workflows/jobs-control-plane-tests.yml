name: jobs-control-plane tests

on:
  pull_request:
    paths:
      - "jobs_control_plane/**"
      - "tests/unit/jobs_control_plane/**"
      - "pyproject.toml"
      - ".github/workflows/jobs-control-plane-tests.yml"

jobs:
  test:
    runs-on: arc-runners

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Run tests
        run: uv run python -m unittest discover -s tests/unit/jobs_control_plane -v
