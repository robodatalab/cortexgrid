name: jobs-control-plane tests

on:
  push:
    paths:
      - "jobs_control_plane/**"
      - "tests/jobs_control_plane_tests/**"
      - "pyproject.toml"
  pull_request:
    paths:
      - "jobs_control_plane/**"
      - "tests/jobs_control_plane_tests/**"
      - "pyproject.toml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Run tests
        run: uv run python -m unittest discover -s tests/jobs_control_plane_tests -v
