name: jobs-control-plane

on:
  push:
    paths:
      - "cortexflow/**"
      - "tests/unit/cortexflow/**"
      - "jobs_control_plane/**"
      - "tests/unit/jobs_control_plane/**"
      - "pyproject.toml"
      - ".github/workflows/jobs-control-plane.yml"
      - "k8s/docker/jobs-control-plane/**"
  pull_request:
    paths:
      - "cortexflow/**"
      - "tests/unit/cortexflow/**"
      - "jobs_control_plane/**"
      - "tests/unit/jobs_control_plane/**"
      - "pyproject.toml"
      - ".github/workflows/**"
      - "k8s/docker/jobs-control-plane/**"

permissions:
  contents: write
  packages: write

jobs:
  cortexflow-test:
    runs-on: arc-runners

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Run tests
        run: uv run python -m unittest discover -s tests/unit/cortexflow -v

  test:
    runs-on: arc-runners

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Run tests
        run: uv run python -m unittest discover -s tests/unit/jobs_control_plane -v

  build-and-push:
    runs-on: arc-runners
    needs: [cortexflow-test, test]
    if: github.event_name == 'push'

    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/jobs-control-plane

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute branch slug
        id: slug
        run: echo "value=$(echo '${{ github.ref_name }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        run: |
          docker buildx build --platform linux/amd64 \
            -f k8s/docker/jobs-control-plane/Dockerfile \
            -t $IMAGE:${{ steps.slug.outputs.value }}-${{ github.sha }} \
            --push .

      - name: Bump image tag in git
        if: github.ref == 'refs/heads/main'
        env:
          NEW_TAG: ${{ steps.slug.outputs.value }}-${{ github.sha }}
        working-directory: k8s/workloads/jobs-control-plane
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            NEW_IMAGE="$IMAGE:$NEW_TAG" yq -i '.spec.template.spec.containers[0].image = strenv(NEW_IMAGE)' deployment.yaml
            git add deployment.yaml
            git diff --cached --quiet && exit 0
            git commit -m "bump jobs-control-plane to $NEW_TAG"
            git push origin HEAD:main && exit 0
            sleep 3
          done
          exit 1
