name: jobs-control-plane

on:
  push:
    paths:
      - "jobs_control_plane/**"
      - "tests/jobs_control_plane_tests/**"
      - "pyproject.toml"
      - ".github/workflows/jobs-control-plane.yml"
  pull_request:
    paths:
      - "jobs_control_plane/**"
      - "tests/jobs_control_plane_tests/**"
      - "pyproject.toml"
      - ".github/workflows/jobs-control-plane.yml"

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Run tests
        run: uv run python -m unittest discover -s tests/jobs_control_plane_tests -v

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    env:
      ECR_REPO: 517906913330.dkr.ecr.us-east-1.amazonaws.com/robolab/jobs-control-plane

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::517906913330:role/robolab-github-actions
          aws-region: us-east-1

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        run: |
          docker buildx build --platform linux/arm64 -f terraform/platform/local-dgx-training/jobs-control-plane/Dockerfile -t $ECR_REPO:latest -t $ECR_REPO:${{ github.sha }} --push .

