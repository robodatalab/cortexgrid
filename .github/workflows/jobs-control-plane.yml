name: jobs-control-plane

on:
  push:
    paths:
      - "cortexflow/**"
      - "tests/cortexflow_tests/**"
      - "jobs_control_plane/**"
      - "tests/jobs_control_plane_tests/**"
      - "pyproject.toml"
      - ".github/workflows/jobs-control-plane.yml"
      - "k8s/docker/jobs-control-plane/**"
  pull_request:
    paths:
      - "cortexflow/**"
      - "tests/cortexflow_tests/**"
      - "jobs_control_plane/**"
      - "tests/jobs_control_plane_tests/**"
      - "pyproject.toml"
      - ".github/workflows/**"
      - "k8s/docker/jobs-control-plane/**"

permissions:
  contents: read
  packages: write

jobs:
  cortexflow-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Run tests
        run: uv run python -m unittest discover -s tests/cortexflow_tests -v

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Run tests
        run: uv run python -m unittest discover -s tests/jobs_control_plane_tests -v

  build-and-push:
    runs-on: ubuntu-latest
    needs: [cortexflow-test, test]
    if: github.event_name == 'push'

    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/jobs-control-plane

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute branch slug
        id: slug
        run: echo "value=$(echo '${{ github.ref_name }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        run: |
          docker buildx build --platform linux/amd64 \
            -f k8s/docker/jobs-control-plane/Dockerfile \
            -t $IMAGE:${{ steps.slug.outputs.value }}-${{ github.sha }} \
            --push .
