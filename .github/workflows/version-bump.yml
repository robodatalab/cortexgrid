name: version-bump

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bump:
    runs-on: arc-runners
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Bump patch and tag
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin "$BRANCH" origin/main
            git reset --hard "origin/$BRANCH"
            MAIN_VERSION=$(git show origin/main:pyproject.toml | grep -E '^version = ' | head -1 | sed -E 's/version = "([^"]+)"/\1/')
            CURRENT=$(grep -E '^version = ' pyproject.toml | head -1 | sed -E 's/version = "([^"]+)"/\1/')
            if [ "$CURRENT" != "$MAIN_VERSION" ]; then
              echo "PR branch version ($CURRENT) already differs from main ($MAIN_VERSION); skipping bump"
              exit 0
            fi
            MAJOR=$(echo "$CURRENT" | cut -d. -f1)
            MINOR=$(echo "$CURRENT" | cut -d. -f2)
            PATCH=$(echo "$CURRENT" | cut -d. -f3)
            NEW="$MAJOR.$MINOR.$((PATCH+1))"
            sed -i -E "s/^version = \"$CURRENT\"/version = \"$NEW\"/" pyproject.toml
            git add pyproject.toml
            git diff --cached --quiet && exit 0
            git commit -m "bump version to $NEW"
            git tag "v$NEW"
            git push origin "HEAD:refs/heads/$BRANCH" --follow-tags && exit 0
            sleep 3
          done
          exit 1
