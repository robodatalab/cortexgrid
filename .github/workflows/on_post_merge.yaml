name: cortexflow-post-merge

on:
    push:
        branches: [main]

jobs:
    detect:
        runs-on: arc-runners
        outputs:
            changed_cortexflow: ${{steps.compute_dependency_fanout.outputs.changed_cortexflow}}
            changed_cortexflow_ui: ${{steps.compute_dependency_fanout.outputs.changed_cortexflow_ui}}
        steps:
            - uses: actions/checkout@v4
            - id: filter
              uses: dorny/paths-filter@v3
              with:
                  filters: |
                      cortexflow:
                          - 'cortexflow/**'
                          - 'tests/unit/cortexflow/**'
                          - 'tests/integration/cortexflow/**'
                          - 'k8s/docker/integration_tests/cortexflow/**'
                          - 'jobs_control_plane/**'
                          - 'k8s/docker/jobs_control_plane/**'
                          - 'tests/unit/jobs_control_plane/**'
                          - 'k8s/docker/mlflow/**'
                          - 'k8s/docker/ray/**'
                      cortexflow_ui:
                          - 'cortexflow_ui/backend/**'
                          - 'tests/unit/cortexflow_ui/backend/**'
                          - 'k8s/docker/cortexflow_ui/backend/**'
                          - 'cortexflow_ui/frontend/**'
                          - 'k8s/docker/cortexflow_ui/frontend/**'
                          - 'tests/unit/cortexflow_ui/frontend/**'
                          - 'tests/integration/cortexflow_ui/**'
                          - 'k8s/docker/integration_tests/cortexflow_ui/**'

            - id: compute_dependency_fanout
              run: |
                  changed_cortexflow=${{steps.filter.outputs.cortexflow}}
                  changed_cortexflow_ui=${{steps.filter.outputs.cortexflow_ui}}

                  if [[ "$changed_cortexflow" == "true" ]]; then
                      changed_cortexflow_ui=true
                  fi

                  echo "changed_cortexflow=$changed_cortexflow" >> "$GITHUB_OUTPUT"
                  echo "changed_cortexflow_ui=$changed_cortexflow_ui" >> "$GITHUB_OUTPUT"

    wait_cortexflow:
        needs: detect
        if: needs.detect.outputs.changed_cortexflow == 'true'
        runs-on: arc-runners
        steps:
            - run: argocd app sync cortexflow && argocd app wait cortexflow --health --sync --timeout 600

    test_cortexflow_integration:
        needs: wait_cortexflow
        runs-on: arc-runners
        steps:
            - run: kubectl apply -f k8s/workloads/cortexflow_integration_tests/job.yaml
            - run: kubectl wait --for=condition=complete job/cortexflow-integration --timeout=15m

    wait_cortexflow_ui:
        needs: [detect, wait_cortexflow] # UI waits for Infra to be healthy first
        if: needs.detect.outputs.changed_cortexflow_ui == 'true'
        runs-on: arc-runners
        steps:
            - run: argocd app sync cortexflow-ui && argocd app wait cortexflow-ui --health --sync --timeout 600

    test_cortexflow_ui_integration:
        needs: [detect, wait_cortexflow_ui]
        if: needs.detect.outputs.changed_cortexflow_ui == 'true'
        runs-on: arc-runners
        steps:
            - run: kubectl apply -f k8s/workloads/cortexflow_ui_integration_tests/job.yaml
            - run: kubectl wait --for=condition=complete job/cortexflow-ui-integration --timeout=15m
