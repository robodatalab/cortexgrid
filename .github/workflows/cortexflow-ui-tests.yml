name: cortexflow-ui tests

on:
  pull_request:
    paths:
      - "cortexflow_ui/**"
      - "tests/unit/cortexflow_ui/backend/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/cortexflow-ui-tests.yml"

jobs:
  backend:
    runs-on: arc-runners
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --group dev --group ui

      - name: Run backend tests
        env:
          PYTHONPATH: cortexflow_ui/backend
        run: uv run python -m unittest discover -s tests/unit/cortexflow_ui/backend -v

  frontend:
    runs-on: arc-runners
    defaults:
      run:
        working-directory: cortexflow_ui/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: cortexflow_ui/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test:run
