name: cortexflow-ui tests

on:
  push:
    paths:
      - "cortexflow-ui/**"
      - "tests/cortexflow-ui/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/cortexflow-ui-tests.yml"
  pull_request:
    paths:
      - "cortexflow-ui/**"
      - "tests/cortexflow-ui/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/cortexflow-ui-tests.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --group dev --group ui

      - name: Run backend tests
        env:
          PYTHONPATH: cortexflow-ui/backend
        run: uv run pytest tests/cortexflow-ui/backend -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cortexflow-ui/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: cortexflow-ui/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test:run
