name: on_post_merge_badges

on:
  push:
    branches: [main]
    paths-ignore: [README.md]

permissions:
  contents: write
  actions: read
  pull-requests: read

jobs:
  promote:
    runs-on: arc-runners
    concurrency:
      group: badges-push
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_JSON=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls")
          PR=$(echo "$PR_JSON" | jq -r '.[0].number // empty')
          if [ -z "$PR" ]; then
            echo "no merged PR for ${{ github.sha }}, nothing to promote"
            exit 0
          fi
          BRANCH=$(echo "$PR_JSON" | jq -r '.[0].head.ref')
          RUN=$(gh api "repos/${{ github.repository }}/actions/workflows/on_pull_request.yaml/runs?branch=$BRANCH&per_page=1" -q '.workflow_runs[0].id')
          if [ -z "$RUN" ]; then
            echo "no on_pull_request run for branch $BRANCH, nothing to promote"
            exit 0
          fi

          JOB_KEYS=(
            test_cortexflow
            test_cortexflow_ui_backend
            test_cortexflow_ui_frontend
            test_jobs_control_plane
            test_k8s_seed
            build_arc_runner
            build_cortexflow_ui_backend
            build_cortexflow_ui_frontend
            build_jobs_control_plane
            build_mlflow
            build_ray
          )

          JOBS=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN/jobs" --paginate)
          for name in "${JOB_KEYS[@]}"; do
            conclusion=$(echo "$JOBS" | jq -r --arg n "$name" '.jobs[] | select(.name==$n) | .conclusion')
            if [ -z "$conclusion" ] || [ "$conclusion" = "skipped" ] || [ "$conclusion" = "cancelled" ]; then
              continue
            fi
            if [ "$conclusion" = "success" ]; then
              msg=passing
            else
              msg=failing
            fi
            sed -i -E "s|<!--s:${name}-->[^<]*<!--/s-->|<!--s:${name}-->${msg}<!--/s-->|" README.md
          done

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add README.md
          if git diff --cached --quiet; then
            echo "no status changes"
            exit 0
          fi
          git commit -m "promote statuses from PR #$PR"
          git push origin main
