name: cortexflow integration tests

on:
  repository_dispatch:
    types: [cortexflow-stack-deployed]

concurrency:
  group: cortexflow-integration-${{ github.event.client_payload.revision }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: arc-runners
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ github.event.client_payload.aws_role_arn }}
          aws-region: eu-west-2

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - run: uv run python -m unittest discover -s tests/integration/cortexflow -t . -v
