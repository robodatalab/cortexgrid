name: cortexflow integration tests

on:
  workflow_dispatch:
    inputs:
      aws_role_arn:
        description: AWS role to assume (e.g. arn:aws:iam::517906913330:role/robolab-github-actions)
        required: true

concurrency:
  group: cortexflow-integration
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.aws_role_arn }}
          aws-region: eu-west-2

      - name: Fetch Tailscale OAuth from Secrets Manager
        run: |
          TS_ID=$(aws secretsmanager get-secret-value --secret-id robolab/infra/TS_OAUTH_CLIENT_ID --query SecretString --output text)
          TS_SECRET=$(aws secretsmanager get-secret-value --secret-id robolab/infra/TS_OAUTH_SECRET --query SecretString --output text)
          echo "::add-mask::$TS_ID"
          echo "::add-mask::$TS_SECRET"
          echo "TS_OAUTH_CLIENT_ID=$TS_ID" >> $GITHUB_ENV
          echo "TS_OAUTH_SECRET=$TS_SECRET" >> $GITHUB_ENV

      - uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_SECRET }}
          tags: tag:ci

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Run integration tests
        run: uv run python -m unittest discover -s tests/integration/cortexflow -t . -v
