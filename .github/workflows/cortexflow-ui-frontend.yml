name: cortexflow-ui-frontend

on:
  push:
    paths:
      - "cortexflow_ui/frontend/**"
      - ".github/workflows/cortexflow-ui-frontend.yml"
      - "k8s/docker/cortexflow-ui/frontend/**"
  pull_request:
    paths:
      - "cortexflow_ui/frontend/**"
      - ".github/workflows/cortexflow-ui-frontend.yml"
      - "k8s/docker/cortexflow-ui/frontend/**"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/cortexflow-ui-frontend

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          docker buildx build --platform linux/arm64 \
            -f k8s/docker/cortexflow-ui/frontend/Dockerfile \
            -t $IMAGE:latest \
            -t $IMAGE:${{ github.sha }} \
            --push .
