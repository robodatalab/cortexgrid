name: ray-head

on:
  push:
    paths:
      - "k8s/docker/ray/**"
      - ".github/workflows/ray-head.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/ray-head

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute branch slug
        id: slug
        run: echo "value=$(echo '${{ github.ref_name }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        run: |
          docker buildx build --platform linux/arm64 \
            -f k8s/docker/ray/Dockerfile \
            -t $IMAGE:${{ steps.slug.outputs.value }}-${{ github.sha }} \
            --push .
