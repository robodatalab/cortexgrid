name: on_pull_request

on:
  pull_request:

permissions:
  contents: write
  packages: write
  pull-requests: read
  statuses: write

concurrency:
  group: cortexgrid-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      changed_arc_runner: ${{steps.compute_dependency_fanout.outputs.changed_arc_runner}}
      changed_cortexgrid: ${{steps.compute_dependency_fanout.outputs.changed_cortexgrid}}
      changed_cortexgrid_integration: ${{steps.compute_dependency_fanout.outputs.changed_cortexgrid_integration}}
      changed_cortexgrid_ui_backend: ${{steps.compute_dependency_fanout.outputs.changed_cortexgrid_ui_backend}}
      changed_cortexgrid_ui_frontend: ${{steps.compute_dependency_fanout.outputs.changed_cortexgrid_ui_frontend}}
      changed_cortexgrid_ui_integration: ${{steps.compute_dependency_fanout.outputs.changed_cortexgrid_ui_integration}}
      changed_jobs_control_plane: ${{steps.compute_dependency_fanout.outputs.changed_jobs_control_plane}}
      changed_k8s_seed: ${{steps.compute_dependency_fanout.outputs.changed_k8s_seed}}
      changed_mlflow: ${{steps.compute_dependency_fanout.outputs.changed_mlflow}}
      changed_ray: ${{steps.compute_dependency_fanout.outputs.changed_ray}}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            arc_runner:
              - 'k8s/docker/arc_runner/**'
            cortexgrid:
              - 'cortexgrid/**'
              - 'tests/unit/cortexgrid/**'
            cortexgrid_integration:
              - 'tests/integration/cortexgrid/**'
              - 'k8s/docker/integration_tests/cortexgrid/**'
            cortexgrid_ui_backend:
              - 'cortexgrid_ui/backend/**'
              - 'tests/unit/cortexgrid_ui/backend/**'
              - 'k8s/docker/cortexgrid_ui/backend/**'
            cortexgrid_ui_frontend:
              - 'cortexgrid_ui/frontend/**'
              - 'k8s/docker/cortexgrid_ui/frontend/**'
              - 'tests/unit/cortexgrid_ui/frontend/**'
            cortexgrid_ui_integration:
              - 'tests/integration/cortexgrid_ui/**'
              - 'k8s/docker/integration_tests/cortexgrid_ui/**'
            jobs_control_plane:
              - 'jobs_control_plane/**'
              - 'k8s/docker/jobs_control_plane/**'
              - 'tests/unit/jobs_control_plane/**'
            k8s_seed:
              - 'k8s/seed/**'
              - 'tests/unit/k8s/seed/**'
            mlflow:
              - 'k8s/docker/mlflow/**'
            ray:
              - 'k8s/docker/ray/**'

      - id: compute_dependency_fanout
        run: |
          changed_arc_runner=${{steps.filter.outputs.arc_runner}}
          changed_cortexgrid=${{steps.filter.outputs.cortexgrid}}
          changed_cortexgrid_integration=${{steps.filter.outputs.cortexgrid_integration}}
          changed_cortexgrid_ui_backend=${{steps.filter.outputs.cortexgrid_ui_backend}}
          changed_cortexgrid_ui_frontend=${{steps.filter.outputs.cortexgrid_ui_frontend}}
          changed_cortexgrid_ui_integration=${{steps.filter.outputs.cortexgrid_ui_integration}}
          changed_jobs_control_plane=${{steps.filter.outputs.jobs_control_plane}}
          changed_k8s_seed=${{steps.filter.outputs.k8s_seed}}
          changed_mlflow=${{steps.filter.outputs.mlflow}}
          changed_ray=${{steps.filter.outputs.ray}}

          if [[ "$changed_cortexgrid" == "true" ]]; then
              changed_cortexgrid_ui_backend=true
              changed_jobs_control_plane=true
              changed_cortexgrid_integration=true
              changed_cortexgrid_ui_integration=true
          fi

          # A run of update_image_tags' bot commit has nothing left to test or
          # build. Building would retag every image under the new SHA and push
          # another bot commit. all_checks_passed reports the verdict the
          # pushing run posted on the commit instead.
          if [[ "${{ github.actor }}" == "github-actions[bot]" ]]; then
              changed_arc_runner=false
              changed_cortexgrid=false
              changed_cortexgrid_integration=false
              changed_cortexgrid_ui_backend=false
              changed_cortexgrid_ui_frontend=false
              changed_cortexgrid_ui_integration=false
              changed_jobs_control_plane=false
              changed_k8s_seed=false
              changed_mlflow=false
              changed_ray=false
          fi

          echo "changed_arc_runner=$changed_arc_runner" >> "$GITHUB_OUTPUT"
          echo "changed_cortexgrid=$changed_cortexgrid" >> "$GITHUB_OUTPUT"
          echo "changed_cortexgrid_integration=$changed_cortexgrid_integration" >> "$GITHUB_OUTPUT"
          echo "changed_cortexgrid_ui_backend=$changed_cortexgrid_ui_backend"  >> "$GITHUB_OUTPUT"
          echo "changed_cortexgrid_ui_frontend=$changed_cortexgrid_ui_frontend"  >> "$GITHUB_OUTPUT"
          echo "changed_cortexgrid_ui_integration=$changed_cortexgrid_ui_integration" >> "$GITHUB_OUTPUT"
          echo "changed_jobs_control_plane=$changed_jobs_control_plane"  >> "$GITHUB_OUTPUT"
          echo "changed_k8s_seed=$changed_k8s_seed"  >> "$GITHUB_OUTPUT"
          echo "changed_mlflow=$changed_mlflow"  >> "$GITHUB_OUTPUT"
          echo "changed_ray=$changed_ray"  >> "$GITHUB_OUTPUT"

  test_cortexgrid:
    needs: detect
    if: needs.detect.outputs.changed_cortexgrid == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11.13"
      - run: uv run --group test-torch python -m unittest discover -s tests/unit/cortexgrid -v

  test_cortexgrid_ui_backend:
    needs: detect
    if: needs.detect.outputs.changed_cortexgrid_ui_backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11.13"
      - run: uv sync --group dev --group ui
      - env:
          PYTHONPATH: cortexgrid_ui/backend
        run: uv run python -m unittest discover -s tests/unit/cortexgrid_ui/backend -v

  test_cortexgrid_ui_frontend:
    needs: detect
    if: needs.detect.outputs.changed_cortexgrid_ui_frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: cortexgrid_ui/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: cortexgrid_ui/frontend

      - name: Run frontend tests
        run: npm run test:run
        working-directory: cortexgrid_ui/frontend

  test_jobs_control_plane:
    needs: detect
    if: needs.detect.outputs.changed_jobs_control_plane == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11.13"
      - run: uv run python -m unittest discover -s tests/unit/jobs_control_plane -v

  test_k8s_seed:
    needs: detect
    if: needs.detect.outputs.changed_k8s_seed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11.13"
      - run: uv run python -m unittest discover -s tests/unit/k8s/seed -v

  build_arc_runner:
    needs: detect
    if: needs.detect.outputs.changed_arc_runner == 'true'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.value }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/arc-runner
    steps:
      - uses: actions/checkout@v4
      - id: t
        run: echo "value=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: exists
        run: |
          if docker manifest inspect "$IMAGE:${{ steps.t.outputs.value }}" >/dev/null 2>&1; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.exists.outputs.value != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: k8s/docker/arc_runner/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.t.outputs.value }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

  build_cortexgrid_integration:
    needs: detect
    if: needs.detect.outputs.changed_cortexgrid_integration == 'true'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.value }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/cortexgrid-integration
    steps:
      - uses: actions/checkout@v4
      - id: t
        run: echo "value=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: exists
        run: |
          if docker manifest inspect "$IMAGE:${{ steps.t.outputs.value }}" >/dev/null 2>&1; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.exists.outputs.value != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: k8s/docker/integration_tests/cortexgrid/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.t.outputs.value }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

  build_cortexgrid_ui_backend:
    needs: test_cortexgrid_ui_backend
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.value }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/cortexgrid-ui-backend
    steps:
      - uses: actions/checkout@v4
      - id: t
        run: echo "value=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: exists
        run: |
          if docker manifest inspect "$IMAGE:${{ steps.t.outputs.value }}" >/dev/null 2>&1; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.exists.outputs.value != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: k8s/docker/cortexgrid_ui/backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.t.outputs.value }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

  build_cortexgrid_ui_frontend:
    needs: test_cortexgrid_ui_frontend
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.value }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/cortexgrid-ui-frontend
    steps:
      - uses: actions/checkout@v4
      - id: t
        run: echo "value=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: exists
        run: |
          if docker manifest inspect "$IMAGE:${{ steps.t.outputs.value }}" >/dev/null 2>&1; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.exists.outputs.value != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: k8s/docker/cortexgrid_ui/frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.t.outputs.value }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

  build_cortexgrid_ui_integration:
    needs: detect
    if: needs.detect.outputs.changed_cortexgrid_ui_integration == 'true'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.value }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/cortexgrid-ui-integration
    steps:
      - uses: actions/checkout@v4
      - id: t
        run: echo "value=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: exists
        run: |
          if docker manifest inspect "$IMAGE:${{ steps.t.outputs.value }}" >/dev/null 2>&1; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.exists.outputs.value != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: k8s/docker/integration_tests/cortexgrid_ui/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.t.outputs.value }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

  build_jobs_control_plane:
    needs: test_jobs_control_plane
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.value }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/jobs-control-plane
    steps:
      - uses: actions/checkout@v4
      - id: t
        run: echo "value=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: exists
        run: |
          if docker manifest inspect "$IMAGE:${{ steps.t.outputs.value }}" >/dev/null 2>&1; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.exists.outputs.value != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: k8s/docker/jobs_control_plane/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.t.outputs.value }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

  build_mlflow:
    needs: detect
    if: needs.detect.outputs.changed_mlflow == 'true'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.value }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/mlflow
    steps:
      - uses: actions/checkout@v4
      - id: t
        run: echo "value=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: exists
        run: |
          if docker manifest inspect "$IMAGE:${{ steps.t.outputs.value }}" >/dev/null 2>&1; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.exists.outputs.value != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: k8s/docker/mlflow/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.t.outputs.value }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

  build_ray:
    needs: detect
    if: needs.detect.outputs.changed_ray == 'true'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.value }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/ray-head
    steps:
      - uses: actions/checkout@v4
      - id: t
        run: echo "value=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: exists
        run: |
          if docker manifest inspect "$IMAGE:${{ steps.t.outputs.value }}" >/dev/null 2>&1; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.exists.outputs.value != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: k8s/docker/ray/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.t.outputs.value }}

  update_image_tags:
    needs:
      [
        test_cortexgrid,
        build_arc_runner,
        build_cortexgrid_integration,
        build_cortexgrid_ui_backend,
        build_cortexgrid_ui_frontend,
        build_cortexgrid_ui_integration,
        build_jobs_control_plane,
        build_mlflow,
        build_ray,
      ]
    # !cancelled() rather than always(): a run cancelled by a newer push must
    # not write its tags onto the branch.
    if: ${{ !cancelled() && contains(needs.*.result, 'success') }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    env:
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11.13"
      - name: Bump the cortexgrid library version
        if: needs.test_cortexgrid.result == 'success'
        run: |
          set -o pipefail
          git fetch --depth=1 origin main
          MAIN_VERSION=$(git show origin/main:pyproject.toml | grep -E '^version = ' | head -1 | sed -E 's/version = "([^"]+)"/\1/')
          CURRENT=$(grep -E '^version = ' pyproject.toml | head -1 | sed -E 's/version = "([^"]+)"/\1/')
          if [ "$CURRENT" = "$MAIN_VERSION" ]; then
            MAJOR=$(echo "$CURRENT" | cut -d. -f1)
            MINOR=$(echo "$CURRENT" | cut -d. -f2)
            PATCH=$(echo "$CURRENT" | cut -d. -f3)
            NEW="$MAJOR.$MINOR.$((PATCH+1))"
            sed -i -E "s/^version = \"$CURRENT\"/version = \"$NEW\"/" pyproject.toml
          fi
          # uv.lock records the project's own version, and the image builds'
          # `uv sync --locked` rejects a lock that lags pyproject.toml.
          uv lock
      - name: Set the new image tags
        run: |
          if [[ "${{ needs.build_arc_runner.result }}" == "success" ]]; then
            NEW_IMAGE="ghcr.io/$OWNER/arc-runner:${{ needs.build_arc_runner.outputs.tag }}" \
              yq -i '.helmCharts[0].valuesInline.template.spec.containers[0].image = strenv(NEW_IMAGE)' k8s/workloads/arc_runner_set/kustomization.yaml
          fi
          if [[ "${{ needs.build_cortexgrid_integration.result }}" == "success" ]]; then
            NEW_IMAGE="ghcr.io/$OWNER/cortexgrid-integration:${{ needs.build_cortexgrid_integration.outputs.tag }}" \
              yq -i '.spec.template.spec.containers[0].image = strenv(NEW_IMAGE)' k8s/workloads/cortexgrid_integration_tests/job.yaml
          fi
          if [[ "${{ needs.build_cortexgrid_ui_backend.result }}" == "success" ]]; then
            NEW_IMAGE="ghcr.io/$OWNER/cortexgrid-ui-backend:${{ needs.build_cortexgrid_ui_backend.outputs.tag }}" \
              yq -i '.helmCharts[0].valuesInline.images.backend = strenv(NEW_IMAGE)' k8s/workloads/cortexgrid_ui/kustomization.yaml
          fi
          if [[ "${{ needs.build_cortexgrid_ui_frontend.result }}" == "success" ]]; then
            NEW_IMAGE="ghcr.io/$OWNER/cortexgrid-ui-frontend:${{ needs.build_cortexgrid_ui_frontend.outputs.tag }}" \
              yq -i '.helmCharts[0].valuesInline.images.frontend = strenv(NEW_IMAGE)' k8s/workloads/cortexgrid_ui/kustomization.yaml
          fi
          if [[ "${{ needs.build_cortexgrid_ui_integration.result }}" == "success" ]]; then
            NEW_IMAGE="ghcr.io/$OWNER/cortexgrid-ui-integration:${{ needs.build_cortexgrid_ui_integration.outputs.tag }}" \
              yq -i '.spec.template.spec.containers[0].image = strenv(NEW_IMAGE)' k8s/workloads/cortexgrid_ui_integration_tests/job.yaml
          fi
          if [[ "${{ needs.build_jobs_control_plane.result }}" == "success" ]]; then
            NEW_IMAGE="ghcr.io/$OWNER/jobs-control-plane:${{ needs.build_jobs_control_plane.outputs.tag }}" \
              yq -i '.helmCharts[0].valuesInline.images.jobsControlPlane = strenv(NEW_IMAGE)' k8s/workloads/cortexgrid/kustomization.yaml
          fi
          if [[ "${{ needs.build_mlflow.result }}" == "success" ]]; then
            NEW_IMAGE="ghcr.io/$OWNER/mlflow:${{ needs.build_mlflow.outputs.tag }}" \
              yq -i '.helmCharts[0].valuesInline.images.mlflow = strenv(NEW_IMAGE)' k8s/workloads/cortexgrid/kustomization.yaml
          fi
          if [[ "${{ needs.build_ray.result }}" == "success" ]]; then
            NEW_IMAGE="ghcr.io/$OWNER/ray-head:${{ needs.build_ray.outputs.tag }}" \
              yq -i '.helmCharts[0].valuesInline.images.ray = strenv(NEW_IMAGE)' k8s/workloads/cortexgrid/kustomization.yaml
          fi
      # One commit for the version bump and the tags. It becomes the PR head,
      # so pushing it before the builds finish would hide them from the PR.
      - id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "bump versions"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  all_checks_passed:
    needs:
      - detect
      - test_cortexgrid
      - test_cortexgrid_ui_backend
      - test_cortexgrid_ui_frontend
      - test_jobs_control_plane
      - test_k8s_seed
      - build_arc_runner
      - build_cortexgrid_integration
      - build_cortexgrid_ui_backend
      - build_cortexgrid_ui_frontend
      - build_cortexgrid_ui_integration
      - build_jobs_control_plane
      - build_mlflow
      - build_ray
      - update_image_tags
    if: always()
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify no upstream failures
        id: verify
        run: |
          # This run is for update_image_tags' bot commit and skipped everything
          # (see detect). The verdict is the one the pushing run posted on it.
          if [[ "${{ github.actor }}" == "github-actions[bot]" ]]; then
            state=$(gh api "repos/${{ github.repository }}/commits/${{ github.event.pull_request.head.sha }}/status" \
              --jq '.statuses[] | select(.context == "all_checks_passed") | .state')
            echo "Verdict posted on this commit by the run that pushed it: ${state:-none}"
            [[ "$state" == "success" ]] || exit 1
            exit 0
          fi
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" \
             || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more upstream jobs failed or were cancelled."
            exit 1
          fi
          echo "All upstream jobs succeeded or were skipped."
      # update_image_tags' commit is now the PR head, and its own run waits for
      # approval and builds nothing. Post this run's verdict on it, so the PR
      # shows the pipeline's result instead of no checks at all.
      - name: Report the verdict on the bot commit
        if: always() && needs.update_image_tags.outputs.sha != ''
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ needs.update_image_tags.outputs.sha }}" \
            -f state="${{ steps.verify.outcome == 'success' && 'success' || 'failure' }}" \
            -f context=all_checks_passed \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
