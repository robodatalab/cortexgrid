name: on_pull_request

on:
  pull_request:

permissions:
  contents: write
  packages: write
  pull-requests: read

concurrency:
  group: cortexflow-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      changed_arc_runner: ${{steps.compute_dependency_fanout.outputs.changed_arc_runner}}
      changed_cortexflow: ${{steps.compute_dependency_fanout.outputs.changed_cortexflow}}
      changed_cortexflow_integration: ${{steps.compute_dependency_fanout.outputs.changed_cortexflow_integration}}
      changed_cortexflow_ui_backend: ${{steps.compute_dependency_fanout.outputs.changed_cortexflow_ui_backend}}
      changed_cortexflow_ui_frontend: ${{steps.compute_dependency_fanout.outputs.changed_cortexflow_ui_frontend}}
      changed_cortexflow_ui_integration: ${{steps.compute_dependency_fanout.outputs.changed_cortexflow_ui_integration}}
      changed_jobs_control_plane: ${{steps.compute_dependency_fanout.outputs.changed_jobs_control_plane}}
      changed_k8s_seed: ${{steps.compute_dependency_fanout.outputs.changed_k8s_seed}}
      changed_mlflow: ${{steps.compute_dependency_fanout.outputs.changed_mlflow}}
      changed_ray: ${{steps.compute_dependency_fanout.outputs.changed_ray}}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            arc_runner:
              - 'k8s/docker/arc_runner/**'
            cortexflow:
              - 'cortexflow/**'
              - 'tests/unit/cortexflow/**'
            cortexflow_integration:
              - 'tests/integration/cortexflow/**'
              - 'k8s/docker/integration_tests/cortexflow/**'
            cortexflow_ui_backend:
              - 'cortexflow_ui/backend/**'
              - 'tests/unit/cortexflow_ui/backend/**'
              - 'k8s/docker/cortexflow_ui/backend/**'
            cortexflow_ui_frontend:
              - 'cortexflow_ui/frontend/**'
              - 'k8s/docker/cortexflow_ui/frontend/**'
              - 'tests/unit/cortexflow_ui/frontend/**'
            cortexflow_ui_integration:
              - 'tests/integration/cortexflow_ui/**'
              - 'k8s/docker/integration_tests/cortexflow_ui/**'
            jobs_control_plane:
              - 'jobs_control_plane/**'
              - 'k8s/docker/jobs_control_plane/**'
              - 'tests/unit/jobs_control_plane/**'
            k8s_seed:
              - 'k8s/seed/**'
              - 'tests/unit/k8s/seed/**'
            mlflow:
              - 'k8s/docker/mlflow/**'
            ray:
              - 'k8s/docker/ray/**'

      - id: compute_dependency_fanout
        run: |
          changed_arc_runner=${{steps.filter.outputs.arc_runner}}
          changed_cortexflow=${{steps.filter.outputs.cortexflow}}
          changed_cortexflow_integration=${{steps.filter.outputs.cortexflow_integration}}
          changed_cortexflow_ui_backend=${{steps.filter.outputs.cortexflow_ui_backend}}
          changed_cortexflow_ui_frontend=${{steps.filter.outputs.cortexflow_ui_frontend}}
          changed_cortexflow_ui_integration=${{steps.filter.outputs.cortexflow_ui_integration}}
          changed_jobs_control_plane=${{steps.filter.outputs.jobs_control_plane}}
          changed_k8s_seed=${{steps.filter.outputs.k8s_seed}}
          changed_mlflow=${{steps.filter.outputs.mlflow}}
          changed_ray=${{steps.filter.outputs.ray}}

          if [[ "$changed_cortexflow" == "true" ]]; then
              changed_cortexflow_ui_backend=true
              changed_jobs_control_plane=true
              changed_cortexflow_integration=true
              changed_cortexflow_ui_integration=true
          fi

          echo "changed_arc_runner=$changed_arc_runner" >> "$GITHUB_OUTPUT"
          echo "changed_cortexflow=$changed_cortexflow" >> "$GITHUB_OUTPUT"
          echo "changed_cortexflow_integration=$changed_cortexflow_integration" >> "$GITHUB_OUTPUT"
          echo "changed_cortexflow_ui_backend=$changed_cortexflow_ui_backend"  >> "$GITHUB_OUTPUT"
          echo "changed_cortexflow_ui_frontend=$changed_cortexflow_ui_frontend"  >> "$GITHUB_OUTPUT"
          echo "changed_cortexflow_ui_integration=$changed_cortexflow_ui_integration" >> "$GITHUB_OUTPUT"
          echo "changed_jobs_control_plane=$changed_jobs_control_plane"  >> "$GITHUB_OUTPUT"
          echo "changed_k8s_seed=$changed_k8s_seed"  >> "$GITHUB_OUTPUT"
          echo "changed_mlflow=$changed_mlflow"  >> "$GITHUB_OUTPUT"
          echo "changed_ray=$changed_ray"  >> "$GITHUB_OUTPUT"

  test_cortexflow:
    needs: detect
    if: needs.detect.outputs.changed_cortexflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv run --group test-torch python -m unittest discover -s tests/unit/cortexflow -v

  bump-cortexflow-version:
    needs: test_cortexflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          MAIN_VERSION=$(git show origin/main:pyproject.toml | grep -E '^version = ' | head -1 | sed -E 's/version = "([^"]+)"/\1/')
          CURRENT=$(grep -E '^version = ' pyproject.toml | head -1 | sed -E 's/version = "([^"]+)"/\1/')
          if [ "$CURRENT" = "$MAIN_VERSION" ]; then
            MAJOR=$(echo "$CURRENT" | cut -d. -f1)
            MINOR=$(echo "$CURRENT" | cut -d. -f2)
            PATCH=$(echo "$CURRENT" | cut -d. -f3)
            NEW="$MAJOR.$MINOR.$((PATCH+1))"
            sed -i -E "s/^version = \"$CURRENT\"/version = \"$NEW\"/" pyproject.toml
          fi

          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "bump cortexflow library version"
          git push

  test_cortexflow_ui_backend:
    needs: detect
    if: needs.detect.outputs.changed_cortexflow_ui_backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --group dev --group ui
      - env:
          PYTHONPATH: cortexflow_ui/backend
        run: uv run python -m unittest discover -s tests/unit/cortexflow_ui/backend -v

  test_cortexflow_ui_frontend:
    needs: detect
    if: needs.detect.outputs.changed_cortexflow_ui_frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: cortexflow_ui/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: cortexflow_ui/frontend

      - name: Run frontend tests
        run: npm run test:run
        working-directory: cortexflow_ui/frontend

  test_jobs_control_plane:
    needs: detect
    if: needs.detect.outputs.changed_jobs_control_plane == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv run python -m unittest discover -s tests/unit/jobs_control_plane -v

  test_k8s_seed:
    needs: detect
    if: needs.detect.outputs.changed_k8s_seed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv run python -m unittest discover -s tests/unit/k8s/seed -v

  build_arc_runner:
    needs: detect
    if: needs.detect.outputs.changed_arc_runner == 'true'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.value }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/arc-runner
    steps:
      - uses: actions/checkout@v4
      - id: t
        run: echo "value=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: exists
        run: |
          if docker manifest inspect "$IMAGE:${{ steps.t.outputs.value }}" >/dev/null 2>&1; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.exists.outputs.value != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: k8s/docker/arc_runner/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.t.outputs.value }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

  build_cortexflow_integration:
    needs: detect
    if: needs.detect.outputs.changed_cortexflow_integration == 'true'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.value }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/cortexflow-integration
    steps:
      - uses: actions/checkout@v4
      - id: t
        run: echo "value=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: exists
        run: |
          if docker manifest inspect "$IMAGE:${{ steps.t.outputs.value }}" >/dev/null 2>&1; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.exists.outputs.value != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: k8s/docker/integration_tests/cortexflow/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.t.outputs.value }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

  build_cortexflow_ui_backend:
    needs: test_cortexflow_ui_backend
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.value }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/cortexflow-ui-backend
    steps:
      - uses: actions/checkout@v4
      - id: t
        run: echo "value=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: exists
        run: |
          if docker manifest inspect "$IMAGE:${{ steps.t.outputs.value }}" >/dev/null 2>&1; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.exists.outputs.value != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: k8s/docker/cortexflow_ui/backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.t.outputs.value }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

  build_cortexflow_ui_frontend:
    needs: test_cortexflow_ui_frontend
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.value }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/cortexflow-ui-frontend
    steps:
      - uses: actions/checkout@v4
      - id: t
        run: echo "value=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: exists
        run: |
          if docker manifest inspect "$IMAGE:${{ steps.t.outputs.value }}" >/dev/null 2>&1; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.exists.outputs.value != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: k8s/docker/cortexflow_ui/frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.t.outputs.value }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

  build_cortexflow_ui_integration:
    needs: detect
    if: needs.detect.outputs.changed_cortexflow_ui_integration == 'true'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.value }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/cortexflow-ui-integration
    steps:
      - uses: actions/checkout@v4
      - id: t
        run: echo "value=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: exists
        run: |
          if docker manifest inspect "$IMAGE:${{ steps.t.outputs.value }}" >/dev/null 2>&1; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.exists.outputs.value != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: k8s/docker/integration_tests/cortexflow_ui/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.t.outputs.value }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

  build_jobs_control_plane:
    needs: test_jobs_control_plane
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.value }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/jobs-control-plane
    steps:
      - uses: actions/checkout@v4
      - id: t
        run: echo "value=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: exists
        run: |
          if docker manifest inspect "$IMAGE:${{ steps.t.outputs.value }}" >/dev/null 2>&1; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.exists.outputs.value != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: k8s/docker/jobs_control_plane/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.t.outputs.value }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

  build_mlflow:
    needs: detect
    if: needs.detect.outputs.changed_mlflow == 'true'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.value }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/mlflow
    steps:
      - uses: actions/checkout@v4
      - id: t
        run: echo "value=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: exists
        run: |
          if docker manifest inspect "$IMAGE:${{ steps.t.outputs.value }}" >/dev/null 2>&1; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.exists.outputs.value != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: k8s/docker/mlflow/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.t.outputs.value }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

  build_ray:
    needs: detect
    if: needs.detect.outputs.changed_ray == 'true'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.value }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/ray-head
    steps:
      - uses: actions/checkout@v4
      - id: t
        run: echo "value=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: exists
        run: |
          if docker manifest inspect "$IMAGE:${{ steps.t.outputs.value }}" >/dev/null 2>&1; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.exists.outputs.value != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: k8s/docker/ray/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.t.outputs.value }}

  update_image_tags:
    needs:
      [
        bump-cortexflow-version,
        build_arc_runner,
        build_cortexflow_integration,
        build_cortexflow_ui_backend,
        build_cortexflow_ui_frontend,
        build_cortexflow_ui_integration,
        build_jobs_control_plane,
        build_mlflow,
        build_ray,
      ]
    if: ${{ always() && contains(needs.*.result, 'success') }}
    runs-on: ubuntu-latest
    env:
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ "${{ needs.build_arc_runner.result }}" == "success" ]]; then
            NEW_IMAGE="ghcr.io/$OWNER/arc-runner:${{ needs.build_arc_runner.outputs.tag }}" \
              yq -i '.helmCharts[0].valuesInline.template.spec.containers[0].image = strenv(NEW_IMAGE)' k8s/workloads/arc_runner_set/kustomization.yaml
          fi
          if [[ "${{ needs.build_cortexflow_integration.result }}" == "success" ]]; then
            NEW_IMAGE="ghcr.io/$OWNER/cortexflow-integration:${{ needs.build_cortexflow_integration.outputs.tag }}" \
              yq -i '.spec.template.spec.containers[0].image = strenv(NEW_IMAGE)' k8s/workloads/cortexflow_integration_tests/job.yaml
          fi
          if [[ "${{ needs.build_cortexflow_ui_backend.result }}" == "success" ]]; then
            NEW_IMAGE="ghcr.io/$OWNER/cortexflow-ui-backend:${{ needs.build_cortexflow_ui_backend.outputs.tag }}" \
              yq -i '.helmCharts[0].valuesInline.images.backend = strenv(NEW_IMAGE)' k8s/workloads/cortexflow_ui/kustomization.yaml
          fi
          if [[ "${{ needs.build_cortexflow_ui_frontend.result }}" == "success" ]]; then
            NEW_IMAGE="ghcr.io/$OWNER/cortexflow-ui-frontend:${{ needs.build_cortexflow_ui_frontend.outputs.tag }}" \
              yq -i '.helmCharts[0].valuesInline.images.frontend = strenv(NEW_IMAGE)' k8s/workloads/cortexflow_ui/kustomization.yaml
          fi
          if [[ "${{ needs.build_cortexflow_ui_integration.result }}" == "success" ]]; then
            NEW_IMAGE="ghcr.io/$OWNER/cortexflow-ui-integration:${{ needs.build_cortexflow_ui_integration.outputs.tag }}" \
              yq -i '.spec.template.spec.containers[0].image = strenv(NEW_IMAGE)' k8s/workloads/cortexflow_ui_integration_tests/job.yaml
          fi
          if [[ "${{ needs.build_jobs_control_plane.result }}" == "success" ]]; then
            NEW_IMAGE="ghcr.io/$OWNER/jobs-control-plane:${{ needs.build_jobs_control_plane.outputs.tag }}" \
              yq -i '.helmCharts[0].valuesInline.images.jobsControlPlane = strenv(NEW_IMAGE)' k8s/workloads/cortexflow/kustomization.yaml
          fi
          if [[ "${{ needs.build_mlflow.result }}" == "success" ]]; then
            NEW_IMAGE="ghcr.io/$OWNER/mlflow:${{ needs.build_mlflow.outputs.tag }}" \
              yq -i '.helmCharts[0].valuesInline.images.mlflow = strenv(NEW_IMAGE)' k8s/workloads/cortexflow/kustomization.yaml
          fi
          if [[ "${{ needs.build_ray.result }}" == "success" ]]; then
            NEW_IMAGE="ghcr.io/$OWNER/ray-head:${{ needs.build_ray.outputs.tag }}" \
              yq -i '.helmCharts[0].valuesInline.images.ray = strenv(NEW_IMAGE)' k8s/workloads/cortexflow/kustomization.yaml
          fi


          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "bump image versions"
          git push

  all_checks_passed:
    needs:
      - detect
      - test_cortexflow
      - bump-cortexflow-version
      - test_cortexflow_ui_backend
      - test_cortexflow_ui_frontend
      - test_jobs_control_plane
      - test_k8s_seed
      - build_arc_runner
      - build_cortexflow_integration
      - build_cortexflow_ui_backend
      - build_cortexflow_ui_frontend
      - build_cortexflow_ui_integration
      - build_jobs_control_plane
      - build_mlflow
      - build_ray
      - update_image_tags
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify no upstream failures
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" \
             || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more upstream jobs failed or were cancelled."
            exit 1
          fi
          echo "All upstream jobs succeeded or were skipped."
