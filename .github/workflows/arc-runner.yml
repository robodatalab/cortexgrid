name: arc-runner

on:
  push:
    paths:
      - "k8s/docker/arc-runner/**"
      - ".github/workflows/arc-runner.yml"

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: arc-runners

    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/arc-runner

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute branch slug
        id: slug
        run: echo "value=$(echo '${{ github.ref_name }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        run: |
          docker buildx build --platform linux/amd64 \
            -f k8s/docker/arc-runner/Dockerfile \
            -t $IMAGE:${{ steps.slug.outputs.value }}-${{ github.sha }} \
            --push k8s/docker/arc-runner

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Bump image tag in git
        if: github.ref == 'refs/heads/main'
        env:
          NEW_TAG: ${{ steps.slug.outputs.value }}-${{ github.sha }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            for f in k8s/argo-deployments/onprem/arc-runner-set/kustomization.yaml k8s/argo-deployments/aws/arc-runner-set/kustomization.yaml; do
              NEW_IMAGE="$IMAGE:$NEW_TAG" yq -i '(.helmCharts[0].valuesInline.template.spec.containers[] | select(.name == "runner")).image = strenv(NEW_IMAGE)' "$f"
              git add "$f"
            done
            git diff --cached --quiet && exit 0
            git commit -m "bump arc-runner to $NEW_TAG"
            git push origin HEAD:main && exit 0
            sleep 3
          done
          exit 1
