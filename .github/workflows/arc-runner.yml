name: arc-runner

on:
  pull_request:
    paths:
      - "k8s/docker/arc-runner/**"
      - ".github/workflows/arc-runner.yml"

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: arc-runners

    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/arc-runner

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute branch slug
        id: slug
        run: echo "value=$(echo '${{ github.head_ref }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        env:
          NEW_TAG: ${{ steps.slug.outputs.value }}-${{ github.event.pull_request.head.sha }}
        run: |
          docker buildx build --platform linux/amd64 \
            -f k8s/docker/arc-runner/Dockerfile \
            -t "$IMAGE:$NEW_TAG" \
            --push k8s/docker/arc-runner

      - name: Bump image tag in git
        env:
          NEW_TAG: ${{ steps.slug.outputs.value }}-${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            for f in k8s/argo-deployments/onprem/arc-runner-set/kustomization.yaml k8s/argo-deployments/aws/arc-runner-set/kustomization.yaml; do
              NEW_IMAGE="$IMAGE:$NEW_TAG" yq -i '(.helmCharts[0].valuesInline.template.spec.containers[] | select(.name == "runner")).image = strenv(NEW_IMAGE)' "$f"
              git add "$f"
            done
            git diff --cached --quiet && exit 0
            git commit -m "bump arc-runner to $NEW_TAG"
            git push origin "HEAD:refs/heads/$BRANCH" && exit 0
            sleep 3
          done
          exit 1
