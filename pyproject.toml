[project]
name = "cortexflow"
version = "0.2.1"
description = "Connect your ML code to the RoboLab compute cluster — Ray, MLflow, and S3"
requires-python = ">=3.11"
dependencies = [
    "ray[default]>=2.9,<3",
    "mlflow>=3.11,<4",
    "boto3>=1.34",
    "setuptools>=82.0.1",
    "tqdm>=4.60",
    "cloudpickle>=3.0",
    "torch>=2.0.0",
    "haikunator>=2.1.0",
    "pip>=23.0",
    "pydantic-settings>=2.13.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "parameterized>=0.9.0",
]
ui = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic-settings>=2.6,<3",
    "kubernetes>=31,<32",
]
