[project]
name = "cortexgrid"
version = "0.3.11"
description = "Connect your ML code to the RoboLab compute cluster — Ray, MLflow, and S3"
readme = "docs/cortexgrid/README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.12"
dependencies = [
    # 2.58 is the floor: the smallest-device scheduler uses node labels with
    # `label_selector` / `fallback_strategy` in a replica's ray_actor_options,
    # which Ray Serve only accepts from 2.55 on, and it is what the cluster image runs.
    "ray[default]>=2.58,<3",
    "mlflow>=3.11,<4",
    "packaging>=24",
    "boto3>=1.34",
    "setuptools>=82.0.1",
    "tqdm>=4.60",
    "cloudpickle>=3.0",
    "haikunator>=2.1.0",
    "pip>=23.0",
    "pydantic-settings>=2.13.1",
    "fabric>=3.2.3",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "pydotenv>=0.0.7",
    "pydantic>=2.13.3",
    "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/robodatalab/cortexgrid"
Repository = "https://github.com/robodatalab/cortexgrid"
Documentation = "https://github.com/robodatalab/cortexgrid/blob/main/docs/cortexgrid/README.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.sdist]
include = ["/cortexgrid"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "parameterized>=0.9.0",
    "playwright>=1.49",
    "types-requests>=2.33.0.20260408",
    "types-tqdm>=4.67.3.20260408",
]
ui = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic-settings>=2.6,<3",
    "kubernetes>=31,<32",
    "psycopg[binary]>=3.2",
]
control-plane = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "psycopg[binary,pool]>=3.2",
]
test-torch = [
    "torch>=2.0.0",
]
