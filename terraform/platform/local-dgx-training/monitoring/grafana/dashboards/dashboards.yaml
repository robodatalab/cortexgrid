apiVersion: 1

providers:
  - name: "default"
    orgId: 1
    folder: "RoboLab"
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false

  - name: "ray"
    orgId: 1
    folder: "Ray"
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    options:
      path: /tmp/ray/session_latest/metrics/grafana/dashboards
      foldersFromFilesStructure: false
