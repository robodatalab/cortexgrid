global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Ray cluster metrics (GPU, CPU, memory, task queue, actors)
  - job_name: "ray"
    static_configs:
      - targets: ["ray-head:8080"]
        labels:
          cluster: "robolab"

  # Node-level OS metrics (CPU, memory, disk, network)
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          host: "dgx-spark"
