# =============================================================================
# RoboLab ML Infrastructure — Docker Compose
# =============================================================================
# Usage:
#   docker compose up -d                          # Start all services
#   docker compose --profile monitoring up -d     # Start only monitoring
#   docker compose down                           # Stop all services
# =============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # Redis — Ray GCS persistent backend
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: robolab-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Ray Head Node — execution engine
  # DGX_TAILSCALE_IP is injected by setup-dgx.sh and used by the entrypoint
  # to build RAY_GRAFANA_IFRAME_HOST (the browser-reachable Grafana URL).
  # ---------------------------------------------------------------------------
  ray-head:
    image: 517906913330.dkr.ecr.us-east-1.amazonaws.com/robolab/ray-head:latest
    container_name: robolab-ray-head
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8265:8265" # Ray Dashboard + Jobs API
      - "6380:6379" # Ray GCS port (mapped to 6380 on host to avoid redis conflict)
      - "8080:8080" # Prometheus metrics
    environment:
      - RAY_REDIS_ADDRESS=redis:6379
      - RAY_GRAFANA_HOST=http://grafana:3000
      - RAY_PROMETHEUS_HOST=http://prometheus:9090
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - DGX_TAILSCALE_IP=${DGX_TAILSCALE_IP}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ray-tmp:/tmp/ray
    healthcheck:
      test: ["CMD", "ray", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # PostgreSQL — MLflow backend store
  # Creds are hardcoded: the DGX is an isolated single-tenant machine,
  # so postgres only needs to distinguish "admin" from "not admin".
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: robolab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: mlflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d mlflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible object store (local replacement for AWS S3)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: robolab-minio
    restart: unless-stopped
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web Console
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: adminadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # MinIO Init — create required buckets (runs once and exits)
  # ---------------------------------------------------------------------------
  minio-init:
    image: minio/mc:RELEASE.2024-01-18T07-03-39Z
    container_name: robolab-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command: /init-buckets.sh
    volumes:
      - ./storage/minio/init-buckets.sh:/init-buckets.sh:ro
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: adminadmin
    restart: "no"
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # MLflow — experiment tracking & model registry
  # ---------------------------------------------------------------------------
  mlflow:
    image: 517906913330.dkr.ecr.us-east-1.amazonaws.com/robolab/mlflow:latest
    container_name: robolab-mlflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "5000:5000"
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: admin          # minio root user
      AWS_SECRET_ACCESS_KEY: adminadmin # minio root password
      MLFLOW_SERVER_ALLOWED_HOSTS: "*"
      MLFLOW_SERVER_CORS_ALLOWED_ORIGINS: "*"
    command: >
      mlflow server
        --host 0.0.0.0
        --port 5000
        --backend-store-uri postgresql://admin:admin@postgres:5432/mlflow
        --default-artifact-root mlflow-artifacts:/
        --serve-artifacts
        --artifacts-destination s3://mlflow-artifacts/
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Jobs Control Plane — polls MLflow for new jobs, schedules them on Ray
  # ---------------------------------------------------------------------------
  jobs-control-plane:
    image: 517906913330.dkr.ecr.us-east-1.amazonaws.com/robolab/jobs-control-plane:latest
    container_name: robolab-jobs-control-plane
    restart: unless-stopped
    depends_on:
      mlflow:
        condition: service_healthy
      ray-head:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      CORTEXFLOW_POLL_INTERVAL: "5"
    volumes:
      - /opt/robolab/project:/project:ro
    working_dir: /project
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -f /tmp/cp_heartbeat && [ $(( $(date +%s) - $(stat -c %Y /tmp/cp_heartbeat) )) -lt 30 ]",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Monitoring — Prometheus, Grafana, Node Exporter
  # ---------------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: robolab-node-exporter
    restart: unless-stopped
    profiles: ["monitoring"]
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:9100/metrics",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v2.48.1
    container_name: robolab-prometheus
    restart: unless-stopped
    profiles: ["monitoring"]
    depends_on:
      node-exporter:
        condition: service_healthy
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:9090/-/healthy",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
    logging: *default-logging

  grafana:
    image: grafana/grafana:10.2.3
    container_name: robolab-grafana
    restart: unless-stopped
    profiles: ["monitoring"]
    depends_on:
      prometheus:
        condition: service_healthy
      ray-head:
        condition: service_started
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ray-tmp:/tmp/ray:ro
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3000/api/health",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
    logging: *default-logging

volumes:
  redis-data:
    name: robolab-redis-data
  ray-tmp:
    name: robolab-ray-tmp
  postgres-data:
    name: robolab-postgres-data
  minio-data:
    name: robolab-minio-data
  prometheus-data:
    name: robolab-prometheus-data
  grafana-data:
    name: robolab-grafana-data
