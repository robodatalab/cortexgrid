# =============================================================================
# Ray Cluster Configuration
# =============================================================================
# This file is a reference for `ray up` usage. In the default Docker Compose
# deployment the head node is started directly via docker-compose.yml.
#
# To add a remote worker (e.g. AWS EC2), run on the worker machine:
#   ray start --address=<DGX_TAILSCALE_IP>:6379 --num-gpus=<N>

cluster_name: robolab

provider:
  type: local
  head_ip: "0.0.0.0"
  worker_ips: []

auth:
  ssh_user: ubuntu

head_node:
  resources:
    CPU: 16
    GPU: 1

worker_nodes:
  resources:
    CPU: 8
    GPU: 1

head_start_ray_commands:
  - >
    ray start --head
      --node-ip-address=0.0.0.0
      --dashboard-host=0.0.0.0
      --dashboard-port=8265
      --metrics-export-port=8080
      --redis-address=redis:6379
      --block

worker_start_ray_commands:
  - >
    ray start
      --address=$RAY_HEAD_IP:6379
      --num-gpus=$NUM_GPUS
      --block
