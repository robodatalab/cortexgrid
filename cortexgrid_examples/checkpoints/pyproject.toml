[project]
name = "cortexgrid-example-checkpoints"
version = "0.1.0"
description = "Example: checkpoint and retry with cortexgrid"
requires-python = ">=3.11"
dependencies = [
    "cortexgrid[training]",
]

[tool.uv.sources]
cortexgrid = { git = "https://github.com/robodatalab/robolab-infra.git" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
