description = "Example: checkpoint and retry with cortexflow"
requires-python = ">=3.11"
dependencies = [
    "cortexflow",
]

[tool.uv.sources]
cortexflow = { git = "https://github.com/paksas/robolab-infra.git" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
