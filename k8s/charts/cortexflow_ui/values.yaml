images:
  backend: ghcr.io/robodatalab/cortexflow-ui-backend:latest
  frontend: ghcr.io/robodatalab/cortexflow-ui-frontend:latest
  integration: ghcr.io/robodatalab/cortexflow-ui-integration:latest

services:
  backend:
    port: 8000
  frontend:
    port: 80
    nodePort: 30088
  ingressHost: cortexflow.robodatalab.com

ingress:
  className: traefik
  tlsSecretName: robodatalab-wildcard-tls

backend:
  # Retry-tolerant MLflow client: outlast a single OOMKill+restart cycle
  # (~30-60s of MLflow downtime) before surfacing the failure to UI users.
  mlflowHttpMaxRetries: 10
  mlflowHttpBackoffFactor: 2
