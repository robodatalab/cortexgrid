apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cortexflow
  labels:
    {{- include "cortexflow_ui.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.services.ingressHost }}
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.services.ingressHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cortexflow-ui-frontend
                port:
                  number: {{ .Values.services.frontend.port }}
