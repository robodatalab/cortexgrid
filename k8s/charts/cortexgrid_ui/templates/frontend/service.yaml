apiVersion: v1
kind: Service
metadata:
  name: cortexgrid-ui-frontend
  labels:
    {{- include "cortexgrid_ui.labels" . | nindent 4 }}
    app: cortexgrid-ui-frontend
spec:
  type: NodePort
  selector:
    app: cortexgrid-ui-frontend
  ports:
    - name: http
      port: {{ .Values.services.frontend.port }}
      targetPort: {{ .Values.services.frontend.port }}
      nodePort: {{ .Values.services.frontend.nodePort }}
