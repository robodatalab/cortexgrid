apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mlflow-config
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    {{- include "cortexgrid.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: mlflow-config
    creationPolicy: Owner
  data:
    # MLFLOW_BACKEND_STORE_URI is composed and stored as a single SM entry by
    # whoever provisions the backend store: terraform/platform/rds (AWS) or
    # k8s/seed/operators/platform_config.py (on-prem).
    - secretKey: MLFLOW_BACKEND_STORE_URI
      remoteRef:
        key: robolab/infra/MLFLOW_BACKEND_STORE_URI
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
