apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mlflow-config
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    {{- include "cortexgrid.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cortexgrid-head
    kind: ClusterSecretStore
  target:
    name: mlflow-config
    creationPolicy: Owner
  data:
    # MLFLOW_BACKEND_STORE_URI is composed and published to the head secrets
    # store by whoever provisions the backend store: the seed's
    # TerraformOutputs from terraform/platform/rds (AWS) or
    # PostgresCredentials (on-prem).
    - secretKey: MLFLOW_BACKEND_STORE_URI
      remoteRef:
        key: MLFLOW_BACKEND_STORE_URI
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
