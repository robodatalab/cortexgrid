{{- if .Values.minio.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: minio
  labels:
    {{- include "cortexflow.labels" . | nindent 4 }}
    app: minio
spec:
  type: NodePort
  selector:
    app: minio
  ports:
    - name: s3
      port: {{ .Values.services.minio.port }}
      targetPort: {{ .Values.services.minio.port }}
      nodePort: 30900
    - name: console
      port: 9001
      targetPort: 9001
      nodePort: 30901
{{- end }}
