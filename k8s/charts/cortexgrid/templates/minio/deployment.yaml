{{- if .Values.minio.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  labels:
    {{- include "cortexgrid.labels" . | nindent 4 }}
    app: minio
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      nodeSelector:
        role: head
      containers:
        - name: minio
          # MinIO deleted minio/minio from Docker Hub in Sep 2026; quay.io still
          # serves the same tags, frozen (no further community releases).
          image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          envFrom:
            # The seed's MinioCredentials operator writes this Secret and
            # publishes the same credentials to the head secrets store.
            - secretRef:
                name: minio-credentials
          ports:
            - name: s3
              containerPort: {{ .Values.services.minio.port }}
            - name: console
              containerPort: 9001
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: "200m"
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: {{ .Values.services.minio.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: {{ .Values.services.minio.port }}
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
{{- end }}
