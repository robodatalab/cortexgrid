apiVersion: apps/v1
kind: Deployment
metadata:
  name: ray-head
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
  labels:
    {{- include "cortexgrid.labels" . | nindent 4 }}
    app: ray-head
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ray-head
  template:
    metadata:
      labels:
        app: ray-head
    spec:
      nodeSelector:
        role: head
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: ray-head
          image: {{ .Values.images.ray }}
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "2"
              memory: 8Gi
          command:
            - ray
            - start
            - --head
            - --dashboard-host=0.0.0.0
            - --metrics-export-port=8080
            - --block
          env:
            # Ray's runtime_env_agent uses unmodified boto3 to fetch s3://
            # working_dir URIs for Serve apps. boto3 only reads the standard
            # AWS_* env var names; map them from the s3-creds Secret's S3_*
            # keys (the object-storage identity in our naming). Same explicit
            # bridge as mlflow. AWS_ENDPOINT_URL_S3 (botocore >=1.31) redirects
            # the S3 service to the in-cluster MinIO Service on on-prem and
            # to regional s3.amazonaws.com on AWS.
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: s3-creds
                  key: S3_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-creds
                  key: S3_SECRET_ACCESS_KEY
            - name: AWS_REGION
              valueFrom:
                secretKeyRef:
                  name: s3-creds
                  key: S3_REGION
            - name: AWS_ENDPOINT_URL_S3
              valueFrom:
                secretKeyRef:
                  name: s3-creds
                  key: S3_ENDPOINT_URL
          envFrom:
            - secretRef:
                name: ray-env
            # SM_* for cortexgrid.secrets (used by serve-app builders and any
            # user code the head invokes). S3_* for cortexgrid.s3_util.
            - secretRef:
                name: sm-creds
            - secretRef:
                name: s3-creds
          ports:
            - name: dashboard
              containerPort: 8265
            - name: client
              containerPort: 10001
            - name: metrics
              containerPort: 8080
            - name: gcs
              containerPort: {{ .Values.services.ray.headPort }}
          livenessProbe:
            exec:
              command: ["ray", "status"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
