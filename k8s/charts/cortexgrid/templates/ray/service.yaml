apiVersion: v1
kind: Service
metadata:
  name: ray-head
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: ray
  labels:
    {{- include "cortexflow.labels" . | nindent 4 }}
    app: ray-head
spec:
  type: NodePort
  selector:
    app: ray-head
  ports:
    - name: dashboard
      port: 8265
      targetPort: 8265
      nodePort: 30265
    - name: client
      port: 10001
      targetPort: 10001
      nodePort: 30001
    - name: serve
      port: 8000
      targetPort: 8000
      nodePort: 30000
    - name: gcs
      port: {{ .Values.services.ray.headPort }}
      targetPort: {{ .Values.services.ray.headPort }}
    - name: metrics
      port: 8080
      targetPort: 8080
