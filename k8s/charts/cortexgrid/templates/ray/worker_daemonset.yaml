{{- /*
One Ray worker DaemonSet per compute flavour, both on `worker=true` nodes (the
seed's ComputeLabels). `gpu=true` nodes (nvidia-smi found a GPU) get the nvidia
runtime and 1 GPU; the rest get a CPU-only worker.
*/}}
{{- $flavours := list
  (dict "name" "ray-worker" "gpu" true)
  (dict "name" "ray-worker-cpu" "gpu" false)
}}
{{- range $flavour := $flavours }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ $flavour.name }}
  labels:
    {{- include "cortexgrid.labels" $ | nindent 4 }}
    app: {{ $flavour.name }}
spec:
  selector:
    matchLabels:
      app: {{ $flavour.name }}
  template:
    metadata:
      labels:
        app: {{ $flavour.name }}
    spec:
      nodeSelector:
        worker: "true"
      {{- if $flavour.gpu }}
        gpu: "true"
      runtimeClassName: nvidia
      {{- else }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: gpu
                    operator: DoesNotExist
      {{- end }}
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: {{ $flavour.name }}
          image: {{ $.Values.images.ray }}
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
              {{- if $flavour.gpu }}
              nvidia.com/gpu: "1"
              {{- end }}
            # No memory limit: Ray sizes its `memory` resource from the pod's
            # cgroup limit, so a limit here - not the host's RAM - would cap
            # what a model can ask for (cortexgrid.ModelRequirements.ram_gb).
            limits:
              cpu: "8"
              {{- if $flavour.gpu }}
              nvidia.com/gpu: "1"
              {{- end }}
          {{- if $flavour.gpu }}
          # Ray has no notion of GPU memory, so the worker advertises the MiB
          # nvidia-smi reports for the GPUs it was given as the custom
          # "vram_mib" resource. A replica requests its model's vram_gb of it
          # (see cortexgrid.model_serving), so Ray places it only on a node
          # whose GPUs have that much memory left.
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              vram_mib=0
              for gpu_mib in $(nvidia-smi --query-gpu=memory.total --format=csv,noheader,nounits); do
                vram_mib=$((vram_mib + gpu_mib))
              done
              [ "$vram_mib" -gt 0 ] || { echo "nvidia-smi reported no GPU" >&2; exit 1; }
              exec ray start \
                --address={{ $.Values.services.ray.headHost }}:{{ $.Values.services.ray.headPort }} \
                --num-gpus=1 \
                --resources="{\"vram_mib\": $vram_mib}" \
                --block
          {{- else }}
          command:
            - ray
            - start
            - --address={{ $.Values.services.ray.headHost }}:{{ $.Values.services.ray.headPort }}
            - --num-gpus=0
            - --block
          {{- end }}
          env:
            # User code shipped via cortexgrid.remote runs in Ray actors here;
            # its cortexgrid.secrets calls go to the head secrets server.
            - name: CORTEXGRID_HEAD_URL
              value: "{{ $.Values.services.head.url }}"
            # Ray's runtime_env_agent fetches s3:// working_dir URIs for Serve
            # replicas with unmodified boto3, which only reads the standard
            # AWS_* env names; map them from the s3-creds Secret's S3_* keys.
            # Same explicit bridge as mlflow. AWS_ENDPOINT_URL_S3 (botocore
            # >=1.31) redirects the S3 service to the in-cluster MinIO Service
            # on on-prem and to regional s3.amazonaws.com on AWS.
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: s3-creds
                  key: S3_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-creds
                  key: S3_SECRET_ACCESS_KEY
            - name: AWS_REGION
              valueFrom:
                secretKeyRef:
                  name: s3-creds
                  key: S3_REGION
            - name: AWS_ENDPOINT_URL_S3
              valueFrom:
                secretKeyRef:
                  name: s3-creds
                  key: S3_ENDPOINT_URL
          envFrom:
            # S3_* for cortexgrid.s3_util.
            - secretRef:
                name: s3-creds
          livenessProbe:
            exec:
              command: ["ray", "status"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
{{- end }}
