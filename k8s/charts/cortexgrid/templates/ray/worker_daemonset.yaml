apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ray-worker
  labels:
    {{- include "cortexgrid.labels" . | nindent 4 }}
    app: ray-worker
spec:
  selector:
    matchLabels:
      app: ray-worker
  template:
    metadata:
      labels:
        app: ray-worker
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        role: worker
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: ray-worker
          image: {{ .Values.images.ray }}
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 32Gi
              nvidia.com/gpu: "1"
          command:
            - ray
            - start
            - --address={{ .Values.services.ray.headHost }}:{{ .Values.services.ray.headPort }}
            - --num-gpus=1
            - --block
          env:
            # Ray's runtime_env_agent fetches s3:// working_dir URIs for Serve
            # replicas with unmodified boto3, which only reads the standard
            # AWS_* env names; map them from the s3-creds Secret's S3_* keys.
            # Same explicit bridge as mlflow. AWS_ENDPOINT_URL_S3 (botocore
            # >=1.31) redirects the S3 service to the in-cluster MinIO Service
            # on on-prem and to regional s3.amazonaws.com on AWS.
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: s3-creds
                  key: S3_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-creds
                  key: S3_SECRET_ACCESS_KEY
            - name: AWS_REGION
              valueFrom:
                secretKeyRef:
                  name: s3-creds
                  key: S3_REGION
            - name: AWS_ENDPOINT_URL_S3
              valueFrom:
                secretKeyRef:
                  name: s3-creds
                  key: S3_ENDPOINT_URL
          envFrom:
            # SM_* for cortexgrid.secrets, S3_* for cortexgrid.s3_util.
            # User code shipped via cortexgrid.remote runs in Ray actors here
            # and uses both.
            - secretRef:
                name: sm-creds
            - secretRef:
                name: s3-creds
          livenessProbe:
            exec:
              command: ["ray", "status"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
