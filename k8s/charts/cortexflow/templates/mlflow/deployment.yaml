apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  labels:
    {{- include "cortexflow.labels" . | nindent 4 }}
    app: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      nodeSelector:
        role: head
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: mlflow
          image: {{ .Values.images.mlflow }}
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "1"
              memory: 4Gi
          env:
            - name: MLFLOW_SERVER_ALLOWED_HOSTS
              value: "*"
            - name: MLFLOW_SERVER_CORS_ALLOWED_ORIGINS
              value: "*"
            # mlflow's S3ArtifactRepository reads MLFLOW_S3_ENDPOINT_URL, not
            # the boto3 standard AWS_S3_ENDPOINT_URL. Alias the same s3-creds
            # value so both profiles work: regional AWS S3 URL on AWS, the
            # in-cluster MinIO Service URL on on-prem.
            - name: MLFLOW_S3_ENDPOINT_URL
              valueFrom:
                secretKeyRef:
                  name: s3-creds
                  key: AWS_S3_ENDPOINT_URL
          envFrom:
            # S3-purposed AWS_ACCESS_KEY_ID/SECRET, AWS_S3_ENDPOINT_URL, S3_BUCKET_NAME.
            # On AWS these target real S3; on on-prem they target in-cluster MinIO.
            - secretRef:
                name: s3-creds
            # MLFLOW_BACKEND_STORE_URI composed and stored as a single SM entry by
            # whoever provisions the backend store.
            - secretRef:
                name: mlflow-config
          command:
            - mlflow
            - server
            - --host
            - 0.0.0.0
            - --port
            - "{{ .Values.services.mlflow.port }}"
            - --default-artifact-root
            - mlflow-artifacts:/
            - --serve-artifacts
            - --artifacts-destination
            - s3://$(S3_BUCKET_NAME)/mlflow-artifacts/
          ports:
            - name: http
              containerPort: {{ .Values.services.mlflow.port }}
          startupProbe:
            httpGet:
              path: /health
              port: {{ .Values.services.mlflow.port }}
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.services.mlflow.port }}
            periodSeconds: 15
            timeoutSeconds: 5
