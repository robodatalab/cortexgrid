apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  labels:
    {{- include "cortexflow.labels" . | nindent 4 }}
    app: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      nodeSelector:
        role: head
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: mlflow
          image: {{ .Values.images.mlflow }}
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "1"
              memory: 4Gi
          env:
            - name: MLFLOW_SERVER_ALLOWED_HOSTS
              value: "*"
            - name: MLFLOW_SERVER_CORS_ALLOWED_ORIGINS
              value: "*"
            # mlflow uses boto3's default chain for artifact uploads and reads
            # MLFLOW_S3_ENDPOINT_URL for the endpoint. Map the s3-creds S3_*
            # keys onto the AWS_* env names boto3 expects, plus the mlflow-
            # specific endpoint var. This is the explicit S3_* -> AWS_* bridge
            # for a third-party server we can't reconfigure.
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: s3-creds
                  key: S3_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-creds
                  key: S3_SECRET_ACCESS_KEY
            - name: AWS_REGION
              valueFrom:
                secretKeyRef:
                  name: s3-creds
                  key: S3_REGION
            - name: MLFLOW_S3_ENDPOINT_URL
              valueFrom:
                secretKeyRef:
                  name: s3-creds
                  key: S3_ENDPOINT_URL
          envFrom:
            # S3_BUCKET_NAME is consumed by the --artifacts-destination flag
            # below as $(S3_BUCKET_NAME).
            - secretRef:
                name: s3-creds
            # MLFLOW_BACKEND_STORE_URI composed and stored as a single SM entry by
            # whoever provisions the backend store.
            - secretRef:
                name: mlflow-config
          command:
            - mlflow
            - server
            - --host
            - 0.0.0.0
            - --port
            - "{{ .Values.services.mlflow.port }}"
            - --default-artifact-root
            - mlflow-artifacts:/
            - --serve-artifacts
            - --artifacts-destination
            - s3://$(S3_BUCKET_NAME)/mlflow-artifacts/
          ports:
            - name: http
              containerPort: {{ .Values.services.mlflow.port }}
          startupProbe:
            httpGet:
              path: /health
              port: {{ .Values.services.mlflow.port }}
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.services.mlflow.port }}
            periodSeconds: 15
            timeoutSeconds: 5
