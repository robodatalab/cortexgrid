apiVersion: v1
kind: ConfigMap
metadata:
  name: mlflow-memory-dashboard
  namespace: monitoring
  labels:
    {{- include "cortexflow.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  mlflow-memory.json: |
    {
      "title": "MLflow memory",
      "uid": "mlflow-memory",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-3h", "to": "now" },
      "panels": [
        {
          "type": "timeseries",
          "title": "Working set bytes vs limit",
          "id": 1,
          "gridPos": { "h": 9, "w": 24, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "targets": [
            {
              "refId": "A",
              "expr": "container_memory_working_set_bytes{namespace=\"{{ .Release.Namespace }}\", pod=~\"mlflow-.*\", container=\"mlflow\"}",
              "legendFormat": "{{ "{{" }}pod{{ "}}" }} working set"
            },
            {
              "refId": "B",
              "expr": "kube_pod_container_resource_limits{namespace=\"{{ .Release.Namespace }}\", pod=~\"mlflow-.*\", resource=\"memory\"}",
              "legendFormat": "{{ "{{" }}pod{{ "}}" }} limit"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Restart count",
          "id": 2,
          "gridPos": { "h": 9, "w": 24, "x": 0, "y": 9 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "refId": "A",
              "expr": "kube_pod_container_status_restarts_total{namespace=\"{{ .Release.Namespace }}\", pod=~\"mlflow-.*\", container=\"mlflow\"}",
              "legendFormat": "{{ "{{" }}pod{{ "}}" }}"
            }
          ]
        }
      ]
    }
