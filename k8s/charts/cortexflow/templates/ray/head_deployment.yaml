apiVersion: apps/v1
kind: Deployment
metadata:
  name: ray-head
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
  labels:
    {{- include "cortexflow.labels" . | nindent 4 }}
    app: ray-head
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ray-head
  template:
    metadata:
      labels:
        app: ray-head
    spec:
      nodeSelector:
        role: head
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: ray-head
          image: {{ .Values.images.ray }}
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "2"
              memory: 8Gi
          command:
            - ray
            - start
            - --head
            - --dashboard-host=0.0.0.0
            - --metrics-export-port=8080
            - --block
          envFrom:
            - secretRef:
                name: ray-env
            # SM_* for cortexflow.secrets (used by serve-app builders and any
            # user code the head invokes). S3_* for cortexflow.s3_util.
            - secretRef:
                name: sm-creds
            - secretRef:
                name: s3-creds
          ports:
            - name: dashboard
              containerPort: 8265
            - name: client
              containerPort: 10001
            - name: metrics
              containerPort: 8080
            - name: gcs
              containerPort: {{ .Values.services.ray.headPort }}
          livenessProbe:
            exec:
              command: ["ray", "status"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
