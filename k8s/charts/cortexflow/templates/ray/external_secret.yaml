apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ray-env
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    {{- include "cortexflow.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: ray-env
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        RAY_GRAFANA_IFRAME_HOST: "http://{{ "{{" }} .CONTROL_PLANE_TAILSCALE_IP {{ "}}" }}:30300"
        RAY_GRAFANA_HOST: "{{ .Values.services.monitoring.grafana }}"
        RAY_PROMETHEUS_HOST: "{{ .Values.services.monitoring.prometheus }}"
  data:
    - secretKey: CONTROL_PLANE_TAILSCALE_IP
      remoteRef:
        key: robolab/infra/CONTROL_PLANE_TAILSCALE_IP
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
