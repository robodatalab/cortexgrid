apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cortexflow
  namespace: argocd
  annotations:
    notifications.argoproj.io/subscribe.on-cortexflow-stack-deployed.github: ""
spec:
  project: default
  source:
    repoURL: https://github.com/robodatalab/robolab-infra.git
    targetRevision: main
    path: k8s/argo-deployments/onprem/cortexflow/cortexflow-infra
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
