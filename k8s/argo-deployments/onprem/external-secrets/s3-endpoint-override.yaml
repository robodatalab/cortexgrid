apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: s3-endpoint-override
  namespace: external-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: s3-endpoint-override
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
  data:
    # On-prem only — points boto3 at in-cluster MinIO. Workload manifests
    # consume this via `envFrom: { secretRef: { name: s3-endpoint-override,
    # optional: true } }`, so on AWS (where this Secret doesn't exist) pods
    # start fine and boto3 falls through to real AWS S3.
    - secretKey: AWS_S3_ENDPOINT_URL
      remoteRef:
        key: robolab/infra/AWS_S3_ENDPOINT_URL
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
