apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cortexflow-ui
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/robodatalab/robolab-infra.git
    targetRevision: main
    path: k8s/workloads/cortexflow-ui
  destination:
    server: https://kubernetes.default.svc
    namespace: cortexflow-ui
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ServerSideDiff=true
