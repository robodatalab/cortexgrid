apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: aws-creds
  namespace: external-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: aws-creds
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
  data:
    # Workload-facing S3 credentials. On AWS these mirror the real AWS keys; on
    # on-prem they hold MinIO admin creds. PlatformConfig (k8s/seed) writes
    # robolab/infra/S3_* per profile. The cluster-level ESO bootstrap separately
    # uses real AWS keys via aws-bootstrap-creds, which is unrelated to this
    # workload-facing Secret.
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: robolab/infra/S3_ACCESS_KEY_ID
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: robolab/infra/S3_SECRET_ACCESS_KEY
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # S3_BUCKET_NAME piggybacks on aws-creds so any pod with `envFrom: aws-creds`
    # gets it for free (mlflow, cortexflow-ui-backend, jobs-control-plane, ray).
    - secretKey: S3_BUCKET_NAME
      remoteRef:
        key: robolab/infra/S3_BUCKET_NAME
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
