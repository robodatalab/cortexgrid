apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: aws-creds
  namespace: external-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: aws-creds
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
  data:
    # Real AWS keys. Used by boto3's default credential chain in any pod that
    # needs to reach AWS Secrets Manager (everything that uses cortexflow.secrets).
    # NOT used for S3/MinIO access -- cortexflow.s3_util builds its boto3 client
    # explicitly with S3-purposed creds from SM (S3_ACCESS_KEY_ID/SECRET).
    # mlflow, which talks to S3 directly via its own boto3, consumes a separate
    # s3-creds Secret instead.
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: robolab/infra/AWS_ACCESS_KEY_ID
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: robolab/infra/AWS_SECRET_ACCESS_KEY
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
