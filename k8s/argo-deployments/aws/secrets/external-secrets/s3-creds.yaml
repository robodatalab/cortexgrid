apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: s3-creds
  namespace: external-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: s3-creds
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
  data:
    # S3-purposed credentials and endpoint. On AWS these mirror the real AWS
    # keys (S3_* in SM), and AWS_S3_ENDPOINT_URL is the real eu-west-2 endpoint.
    # On on-prem these are MinIO admin creds and the in-cluster MinIO Service URL.
    # Consumed by mlflow, which uses boto3 directly to upload artifacts and
    # therefore needs the right env-level creds for whichever S3-API target it
    # talks to. Pods that go through cortexflow.s3_util do NOT need this -- they
    # get the same values from SM via cortexflow.secrets.
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: robolab/infra/S3_ACCESS_KEY_ID
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: robolab/infra/S3_SECRET_ACCESS_KEY
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: AWS_S3_ENDPOINT_URL
      remoteRef:
        key: robolab/infra/AWS_S3_ENDPOINT_URL
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: S3_BUCKET_NAME
      remoteRef:
        key: robolab/infra/S3_BUCKET_NAME
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
