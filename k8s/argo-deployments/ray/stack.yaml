apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ray
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/paksas/robolab-infra.git
    targetRevision: main
    path: k8s/workloads/ray
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: ray
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ServerSideDiff=true
