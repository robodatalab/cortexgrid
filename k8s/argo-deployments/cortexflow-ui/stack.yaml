apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cortexflow-ui
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd-image-updater.argoproj.io/image-list: |
      backend=ghcr.io/paksas/cortexflow-ui-backend,
      frontend=ghcr.io/paksas/cortexflow-ui-frontend
    argocd-image-updater.argoproj.io/backend.update-strategy: newest-build
    argocd-image-updater.argoproj.io/backend.allow-tags: regexp:^main-[0-9a-f]{40}$
    argocd-image-updater.argoproj.io/frontend.update-strategy: newest-build
    argocd-image-updater.argoproj.io/frontend.allow-tags: regexp:^main-[0-9a-f]{40}$
    argocd-image-updater.argoproj.io/write-back-method: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/paksas/robolab-infra.git
    targetRevision: main
    path: k8s/workloads/cortexflow-ui
    kustomize: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: cortexflow-ui
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ServerSideDiff=true
