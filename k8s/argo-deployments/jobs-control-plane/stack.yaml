apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jobs-control-plane
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd-image-updater.argoproj.io/image-list: jobs-control-plane=ghcr.io/paksas/jobs-control-plane
    argocd-image-updater.argoproj.io/jobs-control-plane.update-strategy: newest-build
    argocd-image-updater.argoproj.io/jobs-control-plane.allow-tags: regexp:^main-[0-9a-f]{40}$
    argocd-image-updater.argoproj.io/write-back-method: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/paksas/robolab-infra.git
    targetRevision: main
    path: k8s/workloads/jobs-control-plane
  destination:
    server: https://kubernetes.default.svc
    namespace: jobs-control-plane
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ServerSideDiff=true
