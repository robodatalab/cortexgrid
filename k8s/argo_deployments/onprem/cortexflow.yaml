apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cortexflow
  namespace: argocd
  annotations:
    notifications.argoproj.io/subscribe.on-cortexflow-deployed.argocd-api: ""
spec:
  project: default
  source:
    repoURL: https://github.com/robodatalab/robolab-infra.git
    targetRevision: main
    path: k8s/workloads/cortexflow
  destination:
    server: https://kubernetes.default.svc
    namespace: cortexflow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ServerSideDiff=true
