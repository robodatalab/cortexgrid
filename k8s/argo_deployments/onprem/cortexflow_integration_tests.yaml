apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cortexflow-integration-tests
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/robodatalab/robolab-infra.git
    targetRevision: main
    path: k8s/workloads/cortexflow_integration_tests
  destination:
    server: https://kubernetes.default.svc
    namespace: cortexflow
  syncPolicy:
    # Intentionally no `automated:` block. This App is synced only by the
    # cortexflow chart App's `on-cortexflow-deployed` notification webhook,
    # which guarantees the chart is Synced+Healthy before tests run.
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
