apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-notifications
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/robodatalab/robolab-infra.git
    targetRevision: main
    path: k8s/workloads/argocd_notifications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # The argo-cd Helm chart creates an empty argocd-notifications-cm with
      # field manager "helm". ServerSideApply takes ownership of the keys we
      # set here; fields the chart leaves blank stay blank. The notifications
      # controller hot-reloads on ConfigMap updates -- no restart needed.
      - ServerSideApply=true
