apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 6.36.0
    helm:
      values: |
        deploymentMode: SingleBinary
        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          schemaConfig:
            configs:
              - from: "2024-04-01"
                store: tsdb
                object_store: s3
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h
          storage:
            type: s3
            bucketNames:
              chunks: loki-chunks
              ruler: loki-chunks
              admin: loki-chunks
            s3:
              # On-prem s3-creds points at the in-cluster MinIO Service.
              # path-style is required because MinIO does not do
              # virtual-hosted-style addressing.
              endpoint: "${S3_ENDPOINT_URL}"
              region: "${S3_REGION}"
              accessKeyId: "${S3_ACCESS_KEY_ID}"
              secretAccessKey: "${S3_SECRET_ACCESS_KEY}"
              s3ForcePathStyle: true
          limits_config:
            allow_structured_metadata: true
            volume_enabled: true
            retention_period: 30d
          pattern_ingester:
            enabled: true
        singleBinary:
          replicas: 1
          nodeSelector:
            role: head
          extraArgs:
            - -config.expand-env=true
          extraEnvFrom:
            - secretRef:
                name: s3-creds
          persistence:
            enabled: true
            size: 10Gi
        read:
          replicas: 0
        write:
          replicas: 0
        backend:
          replicas: 0
        chunksCache:
          enabled: false
        resultsCache:
          enabled: false
        gateway:
          enabled: true
          nodeSelector:
            role: head
          ingress:
            enabled: true
            ingressClassName: traefik
            hosts:
              - host: logs.robodatalab.com
                paths:
                  - path: /
                    pathType: Prefix
            tls:
              - hosts:
                  - logs.robodatalab.com
                secretName: robodatalab-wildcard-tls
        test:
          enabled: false
        lokiCanary:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: loki
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
