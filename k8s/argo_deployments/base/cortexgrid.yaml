apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cortexgrid
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/robodatalab/cortexgrid.git
    targetRevision: main
    path: k8s/workloads/cortexgrid
  destination:
    server: https://kubernetes.default.svc
    namespace: cortexgrid
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ServerSideDiff=true
