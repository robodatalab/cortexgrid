apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sm-creds
  namespace: external-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: sm-creds
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      data:
        SM_ACCESS_KEY_ID: "{{ .SM_ACCESS_KEY_ID }}"
        SM_SECRET_ACCESS_KEY: "{{ .SM_SECRET_ACCESS_KEY }}"
        SM_REGION: "{{ .SM_REGION }}"
  data:
    # AWS Secrets Manager identity. Pulled from a dedicated SM slot
    # (robolab/infra/SM_*) so the value can be rotated independently of the
    # other AWS-API identities (ROUTE53_*, S3_*). Today PlatformConfig
    # mirrors the same real-AWS keys into all three slots, but the slots are
    # the contract -- consumers read SM_* and don't see the mirror.
    - secretKey: SM_ACCESS_KEY_ID
      remoteRef:
        key: robolab/infra/SM_ACCESS_KEY_ID
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: SM_SECRET_ACCESS_KEY
      remoteRef:
        key: robolab/infra/SM_SECRET_ACCESS_KEY
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: SM_REGION
      remoteRef:
        key: robolab/infra/SM_REGION
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
