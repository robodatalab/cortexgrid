apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: route53-creds
  namespace: external-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: route53-creds
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      data:
        ROUTE53_ACCESS_KEY_ID: "{{ .ROUTE53_ACCESS_KEY_ID }}"
        ROUTE53_SECRET_ACCESS_KEY: "{{ .ROUTE53_SECRET_ACCESS_KEY }}"
        ROUTE53_REGION: "{{ .ROUTE53_REGION }}"
  data:
    # Route53 identity for cert-manager's DNS-01 ACME challenge. Pulled from
    # a dedicated SM slot so it can be rotated independently of SM_* / S3_*.
    # PlatformConfig mirrors the same real-AWS keys into this slot today;
    # consumers (the cert-manager ClusterIssuer) read ROUTE53_* without
    # seeing the mirror.
    - secretKey: ROUTE53_ACCESS_KEY_ID
      remoteRef:
        key: robolab/infra/ROUTE53_ACCESS_KEY_ID
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: ROUTE53_SECRET_ACCESS_KEY
      remoteRef:
        key: robolab/infra/ROUTE53_SECRET_ACCESS_KEY
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: ROUTE53_REGION
      remoteRef:
        key: robolab/infra/ROUTE53_REGION
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
