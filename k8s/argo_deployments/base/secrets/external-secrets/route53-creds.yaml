apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: route53-creds
  namespace: external-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cortexgrid-head
    kind: ClusterSecretStore
  target:
    name: route53-creds
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      data:
        ROUTE53_ACCESS_KEY_ID: "{{ .ROUTE53_ACCESS_KEY_ID }}"
        ROUTE53_SECRET_ACCESS_KEY: "{{ .ROUTE53_SECRET_ACCESS_KEY }}"
  data:
    # Route53 identity for cert-manager's DNS-01 ACME challenge, kept apart
    # from S3_* so it can be rotated independently. On-prem it comes from
    # .env.head; on AWS the seed's TerraformOutputs publishes the dgx IAM
    # user's keys. The ClusterIssuer pins the region, so none is stored.
    - secretKey: ROUTE53_ACCESS_KEY_ID
      remoteRef:
        key: ROUTE53_ACCESS_KEY_ID
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: ROUTE53_SECRET_ACCESS_KEY
      remoteRef:
        key: ROUTE53_SECRET_ACCESS_KEY
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
