apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: s3-creds
  namespace: external-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cortexgrid-head
    kind: ClusterSecretStore
  target:
    name: s3-creds
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      data:
        S3_ACCESS_KEY_ID: "{{ .S3_ACCESS_KEY_ID }}"
        S3_SECRET_ACCESS_KEY: "{{ .S3_SECRET_ACCESS_KEY }}"
        S3_REGION: "{{ .S3_REGION }}"
        S3_ENDPOINT_URL: "{{ .S3_ENDPOINT_URL }}"
        S3_BUCKET_NAME: "{{ .S3_BUCKET_NAME }}"
  data:
    # Object-storage identity, deliberately distinct from route53-creds.
    # AWS profile: the seed's TerraformOutputs publishes the dgx IAM user's
    # keys, the regional s3.amazonaws.com URL and var.aws_region.
    # On-prem profile: S3_* are MinIO admin creds and S3_ENDPOINT_URL is the
    # in-cluster MinIO Service URL (all from MinioCredentials).
    #
    # Consumers: cortexgrid.s3_util (explicit S3_* env), mlflow and loki
    # (third-party servers that need AWS_* env shape -- their pod specs map
    # S3_* -> AWS_* explicitly), and any other pod whose vanilla boto3 client
    # must reach object storage.
    - secretKey: S3_ACCESS_KEY_ID
      remoteRef:
        key: S3_ACCESS_KEY_ID
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: S3_SECRET_ACCESS_KEY
      remoteRef:
        key: S3_SECRET_ACCESS_KEY
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: S3_REGION
      remoteRef:
        key: S3_REGION
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: S3_ENDPOINT_URL
      remoteRef:
        key: S3_ENDPOINT_URL
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: S3_BUCKET_NAME
      remoteRef:
        key: S3_BUCKET_NAME
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
