apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: cortexgrid-head
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    # The head secrets server (k8s/seed/scripts/cortexgrid_head.py) runs on the
    # head host; the seed's BootstrapSecrets operator points the
    # cortexgrid-head Service at it. No auth: the server is tailnet-only.
    webhook:
      url: "http://cortexgrid-head.default.svc.cluster.local:7700/secrets/{{ .remoteRef.key }}"
      method: GET
      result:
        jsonPath: "$.value"
