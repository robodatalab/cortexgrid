apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-operator-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/robodatalab/cortexgrid.git
    targetRevision: main
    path: k8s/workloads/tailscale_operator
  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://pkgs.tailscale.com/helmcharts
    chart: tailscale-operator
    targetRevision: 1.96.5
    helm:
      values: |
        operatorConfig:
          defaultTags:
            - "tag:k8s"
        # In-process API server proxy in auth mode: tailnet callers reach the
        # cluster API at https://tailscale-operator and are impersonated into
        # the groups granted by the tailnet ACL (tailscale.com/cap/kubernetes).
        apiServerProxyConfig:
          mode: "true"
  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
