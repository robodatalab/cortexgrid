apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/robodatalab/robolab-infra.git
    targetRevision: main
    # Patched per profile by the overlay kustomization to
    # k8s/argo_deployments/{aws,onprem}/secrets. Editing here has no effect.
    # Argo auto-detects kustomize at that path (kustomization.yaml present).
    path: PATCHED-BY-OVERLAY
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Wave -1 (external-secrets, reflector) Applications are created, then
    # wave 0 (ClusterSecretStore) tries to apply before the external-secrets
    # webhook pod is Ready. Tight retry recovers in ~30-60s vs Argo's default
    # 3+ min.
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
