apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobs-control-plane
spec:
  replicas: 1
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app: jobs-control-plane
  template:
    metadata:
      labels:
        app: jobs-control-plane
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: jobs-control-plane
          image: ghcr.io/paksas/jobs-control-plane:main-85d90d56a962c3fd8cc08925452209e7769a8415
          env:
            - name: CORTEXFLOW_POLL_INTERVAL
              value: "5"
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow.mlflow.svc.cluster.local:5000
            - name: RAY_JOB_SERVER_URI
              value: http://ray-head.ray.svc.cluster.local:8265
            - name: AWS_S3_ENDPOINT_URL
              value: http://minio.minio.svc.cluster.local:9000
          envFrom:
            - secretRef:
                name: aws-creds
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - test -f /tmp/cp_heartbeat && [ $(( $(date +%s) - $(stat -c %Y /tmp/cp_heartbeat) )) -lt 30 ]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
