apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobs-control-plane
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jobs-control-plane
  template:
    metadata:
      labels:
        app: jobs-control-plane
    spec:
      nodeSelector:
        role: head
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: jobs-control-plane
          image: ghcr.io/paksas/jobs-control-plane:main-567259b58923f462785bbf003ee21fd2dbb6d7f2
          env:
            - name: CORTEXFLOW_POLL_INTERVAL
              value: "5"
            # Cap parallel job-submission subprocesses; sharing the head EC2 with
            # argocd / mlflow / cortexflow-ui means burst CPU is the constrained
            # resource. Bump higher only after measuring head CPU under load.
            - name: CORTEXFLOW_STARTER_WORKERS
              value: "2"
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow.mlflow.svc.cluster.local:5000
            - name: RAY_JOB_SERVER_URI
              value: http://ray-head.ray.svc.cluster.local:8265
          envFrom:
            # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, S3_BUCKET_NAME via ESO.
            # Contents are real-AWS on AWS, MinIO admin on on-prem.
            - secretRef:
                name: aws-creds
            # On-prem only — points boto3 at in-cluster MinIO. Absent on AWS.
            - secretRef:
                name: s3-endpoint-override
                optional: true
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - test -f /tmp/cp_heartbeat && [ $(( $(date +%s) - $(stat -c %Y /tmp/cp_heartbeat) )) -lt 30 ]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
