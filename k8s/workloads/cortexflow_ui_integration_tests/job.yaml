apiVersion: batch/v1
kind: Job
metadata:
  name: cortexflow-ui-integration-tests
  namespace: cortexflow
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
  labels:
    app.kubernetes.io/part-of: cortexflow-ui
    app.kubernetes.io/component: integration-tests
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        role: head
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: tests
          image: ghcr.io/robodatalab/cortexflow-ui-integration:6833e18848db64499f2e0ca0d5f5043a497ee53e
          volumeMounts:
            - name: test-results
              mountPath: /tmp
            - name: aws-creds
              mountPath: /root/.aws
              readOnly: true
      volumes:
        - name: test-results
          emptyDir: {}
        - name: aws-creds
          secret:
            secretName: aws-creds
            items:
              - key: credentials
                path: credentials
