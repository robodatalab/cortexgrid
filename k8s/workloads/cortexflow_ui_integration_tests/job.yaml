apiVersion: batch/v1
kind: Job
metadata:
  name: cortexflow-ui-integration-tests
  namespace: cortexflow
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
  labels:
    app.kubernetes.io/part-of: cortexflow-ui
    app.kubernetes.io/component: integration-tests
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        role: head
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: tests
          image: ghcr.io/robodatalab/cortexflow-ui-integration:4b8d1225aa3638889292aae676fffde73211d9fd
          env:
            - name: CORTEXFLOW_UI_URL
              value: "http://$(CORTEXFLOW_UI_FRONTEND_SERVICE_HOST):$(CORTEXFLOW_UI_FRONTEND_SERVICE_PORT)"
          envFrom:
            # SM_* for cortexflow.secrets, S3_* for cortexflow.s3_util.
            - secretRef:
                name: sm-creds
            - secretRef:
                name: s3-creds
          volumeMounts:
            - name: test-results
              mountPath: /tmp
      volumes:
        - name: test-results
          emptyDir: {}
