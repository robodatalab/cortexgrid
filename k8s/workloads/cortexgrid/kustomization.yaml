apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Pristine chart lives at k8s/charts/cortexgrid; this overlay supplies the
# mutable bits (image tags) that CI writes to via yq. Mirrors the arc_runner
# kustomize+helm pattern used elsewhere in this repo.
resources:
  - ci_rbac.yaml
helmGlobals:
  chartHome: ../../charts
helmCharts:
  - name: cortexgrid
    releaseName: cortexgrid
    namespace: cortexgrid
    valuesInline:
      images:
        mlflow: ghcr.io/robodatalab/mlflow:8cb531ee99b94bdda24a7f246b12aaa79a757790
        ray: ghcr.io/robodatalab/ray-head:354c71e7ee6b20da4b8cda7928decc105f65dc1b
        jobsControlPlane: ghcr.io/robodatalab/jobs-control-plane:da082c594fc7b194d24261744b4b3bdb6d59b4ca
