apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Pristine chart lives at k8s/charts/cortexgrid; this overlay supplies the
# mutable bits (image tags) that CI writes to via yq. Mirrors the arc_runner
# kustomize+helm pattern used elsewhere in this repo.
resources:
  - ci_rbac.yaml
helmGlobals:
  chartHome: ../../charts
helmCharts:
  - name: cortexgrid
    releaseName: cortexgrid
    namespace: cortexgrid
    valuesInline:
      images:
        mlflow: ghcr.io/robodatalab/mlflow:04228357687bb32056a323b63567d247d5182e53
        ray: ghcr.io/robodatalab/ray-head:e0264f5d97c9dcd65d8655c1b561e7cd9da552b2
        jobsControlPlane: ghcr.io/robodatalab/jobs-control-plane:30a6fcda51885f63e1a945e09a3947e6eb4af187
