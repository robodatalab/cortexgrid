apiVersion: batch/v1
kind: Job
metadata:
  name: cortexflow-ui-integration-tests
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: tests
          image: ghcr.io/robodatalab/cortexflow-ui-integration:34ada3b69d5e43a0ac2f5655bda800eb96dbc77e
          volumeMounts:
            - name: test-results
              mountPath: /tmp
      volumes:
        - name: test-results
          emptyDir: {}