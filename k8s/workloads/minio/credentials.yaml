# Source of truth for MinIO admin credentials. Consumed by the deployment
# itself (sets MINIO_ROOT_USER/PASSWORD on the server) and by the
# publish-config Job (writes them to AWS Secrets Manager so cortexflow can
# read them as S3-purposed credentials).
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
type: Opaque
stringData:
  MINIO_ROOT_USER: admin
  MINIO_ROOT_PASSWORD: adminadmin
