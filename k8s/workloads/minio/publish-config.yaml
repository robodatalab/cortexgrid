# PostSync Job: after MinIO is deployed, publish its config to AWS Secrets
# Manager so cortexflow.s3_util can find it. Replaces the old PlatformConfig
# on-prem hardcoded values - MinIO is now its own source of truth.
#
# Uses two Secrets:
#   - minio-credentials: provides MINIO_ROOT_USER/PASSWORD (the values to publish)
#   - aws-creds: provides AWS_ACCESS_KEY_ID/SECRET (real AWS keys to call SM)
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-publish-config
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: aws-cli
          image: amazon/aws-cli:2.17.42
          envFrom:
            - secretRef:
                name: minio-credentials
            - secretRef:
                name: aws-creds
          env:
            - name: AWS_DEFAULT_REGION
              value: eu-west-2
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              put() {
                aws secretsmanager put-secret-value \
                    --secret-id "robolab/infra/$1" --secret-string "$2" >/dev/null 2>&1 \
                  || aws secretsmanager create-secret \
                       --name "robolab/infra/$1" --secret-string "$2" >/dev/null
                echo "published robolab/infra/$1"
              }
              put S3_ACCESS_KEY_ID "$MINIO_ROOT_USER"
              put S3_SECRET_ACCESS_KEY "$MINIO_ROOT_PASSWORD"
              put S3_BUCKET_NAME mlflow-artifacts
              put AWS_S3_ENDPOINT_URL http://minio.minio.svc.cluster.local:9000
