apiVersion: v1
kind: ServiceAccount
metadata:
  name: arc-runner-ci
  namespace: arc-runners
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: arc-runner-ci-admin
subjects:
  - kind: ServiceAccount
    name: arc-runner-ci
    namespace: arc-runners
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
