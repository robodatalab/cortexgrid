apiVersion: apps/v1
kind: Deployment
metadata:
  name: ray-head
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ray-head
  template:
    metadata:
      labels:
        app: ray-head
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        tier: main
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: ray-head
          image: ghcr.io/paksas/ray-head:main-14b8206bdcb8b580e6ae51a7b495d80f1cd33d46
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "2"
              memory: 8Gi
              nvidia.com/gpu: "1"
          command:
            - ray
            - start
            - --head
            - --dashboard-host=0.0.0.0
            - --metrics-export-port=8080
            - --num-gpus=1
            - --block
          env:
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow.mlflow.svc.cluster.local:5000
            - name: RAY_JOB_SERVER_URI
              value: http://ray-head.ray.svc.cluster.local:8265
            - name: AWS_S3_ENDPOINT_URL
              value: http://minio.minio.svc.cluster.local:9000
          envFrom:
            - secretRef:
                name: ray-env
            - secretRef:
                name: aws-creds
          ports:
            - name: dashboard
              containerPort: 8265
            - name: client
              containerPort: 10001
            - name: metrics
              containerPort: 8080
            - name: gcs
              containerPort: 6379
          livenessProbe:
            exec:
              command: ["ray", "status"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ray-worker
spec:
  selector:
    matchLabels:
      app: ray-worker
  template:
    metadata:
      labels:
        app: ray-worker
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        tier: dev
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: ray-worker
          image: ghcr.io/paksas/ray-head:main-14b8206bdcb8b580e6ae51a7b495d80f1cd33d46
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
              nvidia.com/gpu: "2"
            limits:
              cpu: "8"
              memory: 32Gi
              nvidia.com/gpu: "2"
          command:
            - ray
            - start
            - --address=ray-head.ray.svc.cluster.local:6379
            - --num-gpus=2
            - --block
          env:
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow.mlflow.svc.cluster.local:5000
            - name: RAY_JOB_SERVER_URI
              value: http://ray-head.ray.svc.cluster.local:8265
            - name: AWS_S3_ENDPOINT_URL
              value: http://minio.minio.svc.cluster.local:9000
          envFrom:
            - secretRef:
                name: aws-creds
          livenessProbe:
            exec:
              command: ["ray", "status"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
