apiVersion: apps/v1
kind: Deployment
metadata:
  name: ray-head
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ray-head
  template:
    metadata:
      labels:
        app: ray-head
    spec:
      nodeSelector:
        role: head
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: ray-head
          image: ghcr.io/robodatalab/ray-head:main-69897f2932233e6985dd8f2ad42fa3e9b97b4b32
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "2"
              memory: 8Gi
          command:
            - ray
            - start
            - --head
            - --dashboard-host=0.0.0.0
            - --metrics-export-port=8080
            - --block
          envFrom:
            - secretRef:
                name: ray-env
            # Real AWS keys for cortexflow.secrets to call AWS Secrets Manager.
            # S3 access goes through cortexflow.s3_util (explicit SM-fetched creds).
            - secretRef:
                name: aws-creds
          ports:
            - name: dashboard
              containerPort: 8265
            - name: client
              containerPort: 10001
            - name: metrics
              containerPort: 8080
            - name: gcs
              containerPort: 6379
          livenessProbe:
            exec:
              command: ["ray", "status"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ray-worker
spec:
  selector:
    matchLabels:
      app: ray-worker
  template:
    metadata:
      labels:
        app: ray-worker
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        role: worker
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: ray-worker
          image: ghcr.io/robodatalab/ray-head:main-69897f2932233e6985dd8f2ad42fa3e9b97b4b32
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 32Gi
              nvidia.com/gpu: "1"
          command:
            - ray
            - start
            - --address=ray-head.ray.svc.cluster.local:6379
            - --num-gpus=1
            - --block
          envFrom:
            # Real AWS keys for cortexflow.secrets to call AWS Secrets Manager.
            # S3 access goes through cortexflow.s3_util (explicit SM-fetched creds).
            - secretRef:
                name: aws-creds
          livenessProbe:
            exec:
              command: ["ray", "status"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
