apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-ray-jobs
  labels:
    grafana_dashboard: "1"
data:
  ray-jobs.json: |-
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "title": "Running Tasks",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "sum(ray_tasks{State=\"RUNNING\"})",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 50 },
                  { "color": "red", "value": 100 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "title": "Pending Tasks",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "targets": [
            {
              "expr": "sum(ray_tasks{State=\"PENDING_NODE_ASSIGNMENT\"}) or vector(0)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 10 },
                  { "color": "red", "value": 50 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "title": "Failed Tasks",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "sum(ray_tasks{State=\"FAILED\"}) or vector(0)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": { "mode": "fixed", "fixedColor": "red" }
            },
            "overrides": []
          }
        },
        {
          "title": "Active Actors",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "targets": [
            {
              "expr": "sum(ray_actors{State=\"ALIVE\"}) or vector(0)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "none" },
            "overrides": []
          }
        },
        {
          "title": "Task Throughput (tasks/min)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "targets": [
            {
              "expr": "sum(rate(ray_tasks{State=\"FINISHED\"}[5m])) * 60",
              "legendFormat": "Completed",
              "refId": "A"
            },
            {
              "expr": "sum(rate(ray_tasks{State=\"FAILED\"}[5m])) * 60",
              "legendFormat": "Failed",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "none" },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Failed" },
                "properties": [{ "id": "color", "value": { "fixedColor": "red", "mode": "fixed" } }]
              }
            ]
          }
        },
        {
          "title": "Task State Over Time",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "targets": [
            {
              "expr": "sum by (State) (ray_tasks)",
              "legendFormat": "{{State}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "none" },
            "overrides": []
          }
        },
        {
          "title": "Object Store Memory Usage (GB)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "targets": [
            {
              "expr": "ray_object_store_memory / 1024 / 1024 / 1024",
              "legendFormat": "Used",
              "refId": "A"
            },
            {
              "expr": "ray_object_store_available_memory / 1024 / 1024 / 1024",
              "legendFormat": "Available",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "decgbytes" },
            "overrides": []
          }
        },
        {
          "title": "Failure Rate (%)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "targets": [
            {
              "expr": "sum(rate(ray_tasks{State=\"FAILED\"}[5m])) / (sum(rate(ray_tasks{State=\"FINISHED\"}[5m])) + sum(rate(ray_tasks{State=\"FAILED\"}[5m])) + 1e-10) * 100",
              "legendFormat": "Failure Rate",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 5 },
                  { "color": "red", "value": 20 }
                ]
              }
            },
            "overrides": []
          }
        }
      ],
      "schemaVersion": 39,
      "tags": ["ray", "jobs"],
      "templating": { "list": [] },
      "time": { "from": "now-1h", "to": "now" },
      "title": "Ray Jobs & Tasks",
      "uid": "ray-jobs"
    }
