apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ray-env
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: ray-env
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        RAY_GRAFANA_IFRAME_HOST: "http://{{ .DGX_TAILSCALE_IP }}:30300"
        RAY_GRAFANA_HOST: "http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local:80"
        RAY_PROMETHEUS_HOST: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090"
  data:
    - secretKey: DGX_TAILSCALE_IP
      remoteRef:
        key: robolab/infra/DGX_TAILSCALE_IP
