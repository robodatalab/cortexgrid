apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-ray-overview
  labels:
    grafana_dashboard: "1"
data:
  ray-overview.json: |-
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "title": "GPU Utilization (%)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "ray_node_gpus_utilization",
              "legendFormat": "{{NodeID}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100
            },
            "overrides": []
          }
        },
        {
          "title": "GPU Memory Usage (GB)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "ray_node_gram_used / 1024 / 1024 / 1024",
              "legendFormat": "Used — {{NodeID}}",
              "refId": "A"
            },
            {
              "expr": "ray_node_gram_available / 1024 / 1024 / 1024",
              "legendFormat": "Available — {{NodeID}}",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "decgbytes" },
            "overrides": []
          }
        },
        {
          "title": "CPU Utilization (%)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            {
              "expr": "ray_node_cpu_utilization",
              "legendFormat": "{{NodeID}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100
            },
            "overrides": []
          }
        },
        {
          "title": "Memory Usage (GB)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            {
              "expr": "ray_node_mem_used / 1024 / 1024 / 1024",
              "legendFormat": "Used — {{NodeID}}",
              "refId": "A"
            },
            {
              "expr": "ray_node_mem_available / 1024 / 1024 / 1024",
              "legendFormat": "Available — {{NodeID}}",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "decgbytes" },
            "overrides": []
          }
        },
        {
          "title": "Active Nodes",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 16 },
          "targets": [
            {
              "expr": "count(ray_node_cpu_utilization)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "none" },
            "overrides": []
          }
        },
        {
          "title": "Total GPUs",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 16 },
          "targets": [
            {
              "expr": "sum(ray_node_gpus_available)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "none" },
            "overrides": []
          }
        },
        {
          "title": "Disk Usage (%)",
          "type": "gauge",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 16 },
          "targets": [
            {
              "expr": "ray_node_disk_usage",
              "legendFormat": "{{NodeID}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 70 },
                  { "color": "red", "value": 90 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "title": "Network I/O (MB/s)",
          "type": "timeseries",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 16 },
          "targets": [
            {
              "expr": "rate(ray_node_network_sent[5m]) / 1024 / 1024",
              "legendFormat": "Sent — {{NodeID}}",
              "refId": "A"
            },
            {
              "expr": "rate(ray_node_network_received[5m]) / 1024 / 1024",
              "legendFormat": "Received — {{NodeID}}",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "MBs" },
            "overrides": []
          }
        }
      ],
      "schemaVersion": 39,
      "tags": ["ray", "gpu", "infrastructure"],
      "templating": { "list": [] },
      "time": { "from": "now-1h", "to": "now" },
      "title": "Ray Cluster Overview",
      "uid": "ray-overview"
    }
