apiVersion: v1
kind: Service
metadata:
  name: ray-head
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: ray
spec:
  type: NodePort
  selector:
    app: ray-head
  ports:
    - name: dashboard
      port: 8265
      targetPort: 8265
      nodePort: 30265
    - name: client
      port: 10001
      targetPort: 10001
      nodePort: 30001
    - name: gcs
      port: 6379
      targetPort: 6379
    - name: metrics
      port: 8080
      targetPort: 8080
