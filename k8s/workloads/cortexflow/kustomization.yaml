apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Pristine chart lives at k8s/charts/cortexflow; this overlay supplies the
# mutable bits (image tags) that CI writes to via yq. Mirrors the arc_runner
# kustomize+helm pattern used elsewhere in this repo.
helmGlobals:
  chartHome: ../../charts
helmCharts:
  - name: cortexflow
    releaseName: cortexflow
    namespace: cortexflow
    valuesInline:
      images:
        mlflow: ghcr.io/robodatalab/mlflow:04228357687bb32056a323b63567d247d5182e53
        ray: ghcr.io/robodatalab/ray-head:4efd7fd3aae03c472a921efc67f42d68a2652e93
        jobsControlPlane: ghcr.io/robodatalab/jobs-control-plane:1508769c4422119c5d2682664cc1e156ce54491f
