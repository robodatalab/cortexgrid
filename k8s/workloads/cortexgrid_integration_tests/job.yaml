apiVersion: batch/v1
kind: Job
metadata:
  name: cortexgrid-integration-tests
  namespace: cortexgrid
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
  labels:
    app.kubernetes.io/part-of: cortexgrid
    app.kubernetes.io/component: integration-tests
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        role: head
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: tests
          image: ghcr.io/robodatalab/cortexgrid-integration:e9b39aa5fbbf848e986262bafd4a76b655be86fa
          env:
            # cortexgrid.secrets reads every secret from the head secrets server.
            - name: CORTEXGRID_HEAD_URL
              value: http://cortexgrid-head.default.svc.cluster.local:7700
          envFrom:
            # S3_* for cortexgrid.s3_util.
            - secretRef:
                name: s3-creds
          volumeMounts:
            - name: test-results
              mountPath: /tmp
      volumes:
        - name: test-results
          emptyDir: {}
