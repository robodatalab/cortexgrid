# Bootstraps the `notes` database and applies its schema. Mirrors what
# terraform/platform/rds/notes.tf does for AWS via local-exec psql provisioners.
# Schema is duplicated from terraform/platform/rds/notes-schema.sql -- both
# must be updated together if the schema changes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: notes-schema
data:
  notes-schema.sql: |
    CREATE EXTENSION IF NOT EXISTS pgcrypto;

    CREATE TABLE IF NOT EXISTS run_notes (
      id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      run_id TEXT NOT NULL,
      body TEXT NOT NULL,
      created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
      updated_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    CREATE INDEX IF NOT EXISTS run_notes_run_idx
      ON run_notes (run_id, created_at);

    CREATE TABLE IF NOT EXISTS experiment_notes (
      id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      experiment_name TEXT NOT NULL,
      body TEXT NOT NULL,
      created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
      updated_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    CREATE INDEX IF NOT EXISTS experiment_notes_exp_idx
      ON experiment_notes (experiment_name, created_at);
---
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-notes-init
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: psql
          image: postgres:16.13
          envFrom:
            - secretRef:
                name: postgres-credentials
          env:
            - name: PGPASSWORD
              value: $(POSTGRES_PASSWORD)
            - name: PGHOST
              value: postgres.postgres.svc.cluster.local
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: $(POSTGRES_USER)
          volumeMounts:
            - name: schema
              mountPath: /schema
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              until pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" >/dev/null 2>&1; do
                echo "waiting for postgres at $PGHOST:$PGPORT..."
                sleep 2
              done
              psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='notes'" \
                | grep -q '^1$' \
                || psql -d postgres -c 'CREATE DATABASE notes'
              psql -d notes -v ON_ERROR_STOP=1 -f /schema/notes-schema.sql
      volumes:
        - name: schema
          configMap:
            name: notes-schema
