# Bootstraps the `notes` database and applies its schema. Mirrors what
# terraform/platform/rds/notes.tf does for AWS via local-exec psql provisioners.
# The `notes-schema` ConfigMap mounted here is generated by kustomize from
# notes-schema.sql (see kustomization.yaml).
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-notes-init
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: psql
          image: postgres:16.13
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: PGHOST
              value: postgres.postgres.svc.cluster.local
            - name: PGPORT
              value: "5432"
          volumeMounts:
            - name: schema
              mountPath: /schema
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              until pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" >/dev/null 2>&1; do
                echo "waiting for postgres at $PGHOST:$PGPORT..."
                sleep 2
              done
              psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='notes'" \
                | grep -q '^1$' \
                || psql -d postgres -c 'CREATE DATABASE notes'
              psql -d notes -v ON_ERROR_STOP=1 -f /schema/notes-schema.sql
      volumes:
        - name: schema
          configMap:
            name: notes-schema
