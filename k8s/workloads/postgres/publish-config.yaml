# PostSync Job: after postgres is deployed, compose the per-DB connection URIs
# and publish them to AWS Secrets Manager so mlflow's mlflow-config
# ExternalSecret and cortexflow_ui's notes backend can find them. Mirrors
# what terraform/platform/rds/{rds.tf,notes.tf} do for AWS.
#
# Uses two Secrets:
#   - postgres-credentials: provides POSTGRES_USER/PASSWORD/DB (URI components)
#   - aws-creds: provides AWS_ACCESS_KEY_ID/SECRET (real AWS keys to call SM)
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-publish-config
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: aws-cli
          image: amazon/aws-cli:2.17.42
          envFrom:
            - secretRef:
                name: postgres-credentials
            - secretRef:
                name: aws-creds
          env:
            - name: AWS_DEFAULT_REGION
              value: eu-west-2
            - name: PG_HOST
              value: postgres.postgres.svc.cluster.local
            - name: PG_PORT
              value: "5432"
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              put() {
                aws secretsmanager put-secret-value \
                    --secret-id "robolab/infra/$1" --secret-string "$2" >/dev/null 2>&1 \
                  || aws secretsmanager create-secret \
                       --name "robolab/infra/$1" --secret-string "$2" >/dev/null
                echo "published robolab/infra/$1"
              }
              MLFLOW_URI="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${PG_HOST}:${PG_PORT}/${POSTGRES_DB}"
              NOTES_URI="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${PG_HOST}:${PG_PORT}/notes"
              put MLFLOW_BACKEND_STORE_URI "$MLFLOW_URI"
              put NOTES_DB_URI "$NOTES_URI"
