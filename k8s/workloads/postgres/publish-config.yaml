# PostSync Job: after Postgres is deployed, compose MLFLOW_BACKEND_STORE_URI
# from its credentials and publish to AWS Secrets Manager so mlflow's
# mlflow-config ExternalSecret can resolve. Replaces the old PlatformConfig
# on-prem hardcoded URI.
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-publish-config
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: aws-cli
          image: amazon/aws-cli:2.17.42
          envFrom:
            - secretRef:
                name: postgres-credentials
            - secretRef:
                name: aws-creds
          env:
            - name: AWS_DEFAULT_REGION
              value: eu-west-2
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              URI="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres.postgres.svc.cluster.local:5432/${POSTGRES_DB}"
              aws secretsmanager put-secret-value \
                  --secret-id "robolab/infra/MLFLOW_BACKEND_STORE_URI" --secret-string "$URI" >/dev/null 2>&1 \
                || aws secretsmanager create-secret \
                     --name "robolab/infra/MLFLOW_BACKEND_STORE_URI" --secret-string "$URI" >/dev/null
              echo "published robolab/infra/MLFLOW_BACKEND_STORE_URI"
