# PostSync Job: bootstrap the `notes` database used by cortexflow-ui for
# experiment/run notes, and publish its connection URI to AWS Secrets Manager.
# Idempotent: safe to re-run on every sync.
apiVersion: batch/v1
kind: Job
metadata:
  name: notes-bootstrap
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: bootstrap-db
          image: postgres:15-alpine
          envFrom:
            - secretRef:
                name: postgres-credentials
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              export PGPASSWORD="$POSTGRES_PASSWORD"
              PSQL="psql -h postgres.postgres.svc.cluster.local -U $POSTGRES_USER"
              EXISTS=$($PSQL -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='notes'")
              if [ "$EXISTS" != "1" ]; then
                $PSQL -d postgres -c "CREATE DATABASE notes"
              fi
              $PSQL -d notes -v ON_ERROR_STOP=1 <<'SQL'
              CREATE TABLE IF NOT EXISTS run_notes (
                id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
                run_id TEXT NOT NULL,
                body TEXT NOT NULL,
                created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
                updated_at TIMESTAMPTZ NOT NULL DEFAULT now()
              );
              CREATE INDEX IF NOT EXISTS run_notes_run_idx
                ON run_notes (run_id, created_at);
              CREATE TABLE IF NOT EXISTS experiment_notes (
                id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
                experiment_name TEXT NOT NULL,
                body TEXT NOT NULL,
                created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
                updated_at TIMESTAMPTZ NOT NULL DEFAULT now()
              );
              CREATE INDEX IF NOT EXISTS experiment_notes_exp_idx
                ON experiment_notes (experiment_name, created_at);
              SQL
      containers:
        - name: publish-uri
          image: amazon/aws-cli:2.17.42
          envFrom:
            - secretRef:
                name: postgres-credentials
            - secretRef:
                name: aws-creds
          env:
            - name: AWS_DEFAULT_REGION
              value: eu-west-2
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              URI="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres.postgres.svc.cluster.local:5432/notes"
              aws secretsmanager put-secret-value \
                  --secret-id "robolab/infra/NOTES_DB_URI" --secret-string "$URI" >/dev/null 2>&1 \
                || aws secretsmanager create-secret \
                     --name "robolab/infra/NOTES_DB_URI" --secret-string "$URI" >/dev/null
              echo "published robolab/infra/NOTES_DB_URI"
