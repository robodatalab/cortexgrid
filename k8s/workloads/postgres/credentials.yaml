# Source of truth for Postgres credentials. Consumed by the deployment itself
# (sets POSTGRES_USER/PASSWORD/DB on the server) and by the publish-config Job
# (composes MLFLOW_BACKEND_STORE_URI and writes it to AWS Secrets Manager).
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
type: Opaque
stringData:
  POSTGRES_USER: admin
  POSTGRES_PASSWORD: admin
  POSTGRES_DB: mlflow
