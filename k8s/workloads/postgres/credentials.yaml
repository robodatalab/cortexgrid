# Source of truth for postgres admin credentials. Consumed by the deployment
# itself (sets POSTGRES_USER/PASSWORD/DB on the server), the notes-init Job
# (creates the notes DB and applies the schema), and the publish-config Job
# (composes MLFLOW_BACKEND_STORE_URI + NOTES_DB_URI and writes them to AWS
# Secrets Manager). User and initial DB mirror terraform/platform/rds defaults.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
type: Opaque
stringData:
  POSTGRES_USER: robolab
  POSTGRES_PASSWORD: robolabrobolab
  POSTGRES_DB: mlflow
