apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - notes-init.yaml

# Synthesize the notes-schema ConfigMap from the same SQL file terraform's
# RDS bootstrap consumes (terraform/platform/rds/notes.tf), so the schema has
# a single source of truth across both deployment paths.
configMapGenerator:
  - name: notes-schema
    files:
      - notes-schema.sql

generatorOptions:
  disableNameSuffixHash: true
