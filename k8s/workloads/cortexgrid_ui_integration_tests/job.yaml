apiVersion: batch/v1
kind: Job
metadata:
  name: cortexgrid-ui-integration-tests
  namespace: cortexgrid
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
  labels:
    app.kubernetes.io/part-of: cortexgrid-ui
    app.kubernetes.io/component: integration-tests
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        role: head
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: tests
          image: ghcr.io/robodatalab/cortexgrid-ui-integration:6d04340eb4f8adc9842ddf97a29f40b07ab97c30
          env:
            # cortexgrid.secrets reads every secret from the head secrets server.
            - name: CORTEXGRID_HEAD_URL
              value: http://cortexgrid-head.default.svc.cluster.local:7700
            - name: CORTEXGRID_UI_URL
              value: "http://$(CORTEXGRID_UI_FRONTEND_SERVICE_HOST):$(CORTEXGRID_UI_FRONTEND_SERVICE_PORT)"
          envFrom:
            # S3_* for cortexgrid.s3_util.
            - secretRef:
                name: s3-creds
          volumeMounts:
            - name: test-results
              mountPath: /tmp
      volumes:
        - name: test-results
          emptyDir: {}
