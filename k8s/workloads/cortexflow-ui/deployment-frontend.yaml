apiVersion: apps/v1
kind: Deployment
metadata:
  name: cortexflow-ui-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cortexflow-ui-frontend
  template:
    metadata:
      labels:
        app: cortexflow-ui-frontend
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: cortexflow-ui-frontend
          image: ghcr.io/paksas/cortexflow-ui-frontend:main-c9396f54e7ba4bf96a388a93346d7e9add6035e5
          ports:
            - name: http
              containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
