apiVersion: apps/v1
kind: Deployment
metadata:
  name: cortexflow-ui-frontend
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cortexflow-ui-frontend
  template:
    metadata:
      labels:
        app: cortexflow-ui-frontend
    spec:
      nodeSelector:
        role: head
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: cortexflow-ui-frontend
          image: ghcr.io/robodatalab/cortexflow-ui-frontend:main-69897f2932233e6985dd8f2ad42fa3e9b97b4b32
          ports:
            - name: http
              containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
