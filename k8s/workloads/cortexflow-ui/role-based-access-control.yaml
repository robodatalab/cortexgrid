apiVersion: v1
kind: ServiceAccount
metadata:
  name: cortexflow-ui-backend
  namespace: cortexflow-ui
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cortexflow-ui-backend-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cortexflow-ui-backend-reader
subjects:
  - kind: ServiceAccount
    name: cortexflow-ui-backend
    namespace: cortexflow-ui
roleRef:
  kind: ClusterRole
  name: cortexflow-ui-backend-reader
  apiGroup: rbac.authorization.k8s.io
