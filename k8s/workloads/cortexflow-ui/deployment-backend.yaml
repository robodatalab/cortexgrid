apiVersion: apps/v1
kind: Deployment
metadata:
  name: cortexflow-ui-backend
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cortexflow-ui-backend
  template:
    metadata:
      labels:
        app: cortexflow-ui-backend
    spec:
      nodeSelector:
        role: head
      serviceAccountName: cortexflow-ui-backend
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: cortexflow-ui-backend
          image: ghcr.io/paksas/cortexflow-ui-backend:main-34dc5a8c9c13a9a82899861d1237aa39c812bad0
          env:
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow.mlflow.svc.cluster.local:5000
            - name: RAY_JOB_SERVER_URI
              value: http://ray-head.ray.svc.cluster.local:8265
          envFrom:
            # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, S3_BUCKET_NAME — boto3
            # picks them up automatically. Contents are real-AWS on AWS, MinIO
            # admin on on-prem.
            - secretRef:
                name: aws-creds
            - secretRef:
                name: cortexflow-ui-public-urls
            # On-prem only — points boto3 at in-cluster MinIO. Absent on AWS.
            - secretRef:
                name: s3-endpoint-override
                optional: true
          ports:
            - name: http
              containerPort: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
