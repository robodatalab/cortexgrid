apiVersion: apps/v1
kind: Deployment
metadata:
  name: cortexflow-ui-backend
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cortexflow-ui-backend
  template:
    metadata:
      labels:
        app: cortexflow-ui-backend
    spec:
      nodeSelector:
        role: head
      serviceAccountName: cortexflow-ui-backend
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: cortexflow-ui-backend
          image: ghcr.io/paksas/cortexflow-ui-backend:main-d9c2df3d50e79d45c13f8827cc3ad95d0785a571
          envFrom:
            # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY for boto3's default
            # credential chain (used when cortexflow.secrets reads SM).
            - secretRef:
                name: aws-creds
          ports:
            - name: http
              containerPort: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
