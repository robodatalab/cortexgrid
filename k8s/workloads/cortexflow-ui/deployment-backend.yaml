apiVersion: apps/v1
kind: Deployment
metadata:
  name: cortexflow-ui-backend
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cortexflow-ui-backend
  template:
    metadata:
      labels:
        app: cortexflow-ui-backend
    spec:
      nodeSelector:
        role: head
      serviceAccountName: cortexflow-ui-backend
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: cortexflow-ui-backend
          image: ghcr.io/paksas/cortexflow-ui-backend:main-038ed57683200092f8e0572b16b880a0f22c7593
          env:
            # Retry-tolerant MLflow client: outlast a single OOMKill+restart cycle
            # (~30-60s of MLflow downtime) before surfacing the failure to UI users.
            # Default 7 retries + factor 2 yields ~4 min of retry budget; we extend
            # to ~8 min to also cover slow startupProbe under load.
            - name: MLFLOW_HTTP_REQUEST_MAX_RETRIES
              value: "10"
            - name: MLFLOW_HTTP_REQUEST_BACKOFF_FACTOR
              value: "2"
          envFrom:
            # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY for boto3's default
            # credential chain (used when cortexflow.secrets reads SM).
            - secretRef:
                name: aws-creds
          ports:
            - name: http
              containerPort: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
