apiVersion: v1
kind: Service
metadata:
  name: cortexflow-ui-backend
spec:
  type: ClusterIP
  selector:
    app: cortexflow-ui-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: cortexflow-ui-frontend
spec:
  type: NodePort
  selector:
    app: cortexflow-ui-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30088
