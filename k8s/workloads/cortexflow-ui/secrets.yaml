apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cortexflow-ui-public-urls
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: cortexflow-ui-public-urls
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: PUBLIC_MLFLOW_URL
      remoteRef:
        key: robolab/infra/MLFLOW_TRACKING_URI
    - secretKey: PUBLIC_RAY_DASHBOARD_URL
      remoteRef:
        key: robolab/infra/RAY_JOB_SERVER_URI
