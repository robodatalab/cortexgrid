apiVersion: batch/v1
kind: Job
metadata:
  name: cortexflow-integration-tests
  namespace: cortexflow
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
  labels:
    app.kubernetes.io/part-of: cortexflow
    app.kubernetes.io/component: integration-tests
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        role: head
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: tests
          image: ghcr.io/robodatalab/cortexflow-integration:f0002ae1168de754e038d356316d411e412b5f8d
          envFrom:
            # SM_* for cortexflow.secrets, S3_* for cortexflow.s3_util.
            - secretRef:
                name: sm-creds
            - secretRef:
                name: s3-creds
          volumeMounts:
            - name: test-results
              mountPath: /tmp
      volumes:
        - name: test-results
          emptyDir: {}
