apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      nodeSelector:
        role: head
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: mlflow
          image: ghcr.io/paksas/mlflow:main-14b8206bdcb8b580e6ae51a7b495d80f1cd33d46
          resources:
            requests:
              cpu: "200m"
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          env:
            - name: MLFLOW_SERVER_ALLOWED_HOSTS
              value: "*"
            - name: MLFLOW_SERVER_CORS_ALLOWED_ORIGINS
              value: "*"
          envFrom:
            # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, S3_BUCKET_NAME — boto3
            # picks the creds up automatically. Contents differ per profile:
            # real AWS keys + bucket on AWS, MinIO admin + on-prem bucket on on-prem.
            - secretRef:
                name: aws-creds
            # MLFLOW_BACKEND_STORE_URI — single composed value, written to SM by
            # whoever provisions the backend store (terraform on AWS, head-setup
            # on on-prem).
            - secretRef:
                name: mlflow-config
            # AWS_S3_ENDPOINT_URL — only present on on-prem (deployed under
            # argo-deployments/onprem/**). Optional so AWS pods start fine
            # without it; absent → boto3 hits real AWS S3.
            - secretRef:
                name: s3-endpoint-override
                optional: true
          command:
            - mlflow
            - server
            - --host
            - 0.0.0.0
            - --port
            - "5000"
            - --default-artifact-root
            - mlflow-artifacts:/
            - --serve-artifacts
            - --artifacts-destination
            - s3://$(S3_BUCKET_NAME)/mlflow-artifacts/
          ports:
            - name: http
              containerPort: 5000
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
