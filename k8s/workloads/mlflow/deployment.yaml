apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      nodeSelector:
        role: head
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: mlflow
          image: ghcr.io/paksas/mlflow:main-14b8206bdcb8b580e6ae51a7b495d80f1cd33d46
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "1"
              memory: 4Gi
          env:
            - name: MLFLOW_SERVER_ALLOWED_HOSTS
              value: "*"
            - name: MLFLOW_SERVER_CORS_ALLOWED_ORIGINS
              value: "*"
          envFrom:
            # S3-purposed AWS_ACCESS_KEY_ID/SECRET, AWS_S3_ENDPOINT_URL, S3_BUCKET_NAME.
            # On AWS these target real S3; on on-prem they target in-cluster MinIO.
            # mlflow uses boto3 directly to upload artifacts, so it needs the right
            # env creds for whichever target -- separate from the aws-creds Secret
            # that other workloads consume for AWS-SM access.
            - secretRef:
                name: s3-creds
            # MLFLOW_BACKEND_STORE_URI -- composed value written to SM by whoever
            # provisions the backend store (terraform on AWS, head-setup on on-prem).
            - secretRef:
                name: mlflow-config
          command:
            - mlflow
            - server
            - --host
            - 0.0.0.0
            - --port
            - "5000"
            - --default-artifact-root
            - mlflow-artifacts:/
            - --serve-artifacts
            - --artifacts-destination
            - s3://$(S3_BUCKET_NAME)/mlflow-artifacts/
          ports:
            - name: http
              containerPort: 5000
          startupProbe:
            httpGet:
              path: /health
              port: 5000
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            periodSeconds: 15
            timeoutSeconds: 5
