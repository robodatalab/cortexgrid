apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mlflow-config
  namespace: mlflow
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: mlflow-config
    creationPolicy: Owner
  data:
    # MLFLOW_BACKEND_STORE_URI is composed and stored as a single SM entry by
    # whoever provisions the backend store: terraform/platform/rds (AWS) or
    # k8s/seed/operators/platform_config.py (on-prem). The ESO template branch
    # that used to reconstruct the URI from RDS_* parts is gone.
    - secretKey: MLFLOW_BACKEND_STORE_URI
      remoteRef:
        key: robolab/infra/MLFLOW_BACKEND_STORE_URI
