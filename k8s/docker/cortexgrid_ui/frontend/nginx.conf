map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://cortexgrid-ui-backend.cortexgrid.svc.cluster.local:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    location /health {
        proxy_pass http://cortexgrid-ui-backend.cortexgrid.svc.cluster.local:8000;
    }

    # Never cache the entry point: it is the tiny file that names the current
    # content-hashed bundles, so it must be revalidated on every load. Without
    # this a redeploy leaves browsers requesting old asset hashes, which the
    # SPA fallback below answers with index.html (text/html) - the MIME error.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Hashed bundles are immutable: a new build gets a new name, so cache hard.
    # A missing asset 404s instead of falling back to index.html.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
