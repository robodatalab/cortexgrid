apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: argocd
  namespace: kube-system
spec:
  chart: argo-cd
  repo: https://argoproj.github.io/argo-helm
  version: 7.7.0
  targetNamespace: argocd
  createNamespace: true
  valuesContent: |-
    global:
      nodeSelector:
        role: head
    server:
      extraArgs:
        - --insecure
        - --disable-auth
      service:
        type: NodePort
        nodePortHttp: 30080
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-bootstrap
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/paksas/robolab-infra.git
    targetRevision: main
    path: k8s/argo-deployments
    directory:
      recurse: true
      # AWS profile: skip on-prem-only Apps (postgres, minio — replaced by RDS, S3).
      # K3sServer rewrites this to an empty string when sys_vendor != "Amazon EC2".
      exclude: 'onprem/**'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Tight retry to absorb the App-of-Apps wave gap: when wave -1 Applications
    # (external-secrets, reflector) are created, ArgoCD moves to wave 0 before
    # their child pods (e.g. external-secrets-webhook) are Ready. Wave 0
    # resources that depend on those pods (ClusterSecretStore validation
    # webhook) fail their first apply. Without this block, ArgoCD's default
    # backoff stretches recovery to 3+ minutes; with it, ~30-60s.
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
