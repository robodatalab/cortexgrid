apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: argocd
  namespace: kube-system
spec:
  chart: argo-cd
  repo: https://argoproj.github.io/argo-helm
  version: 9.5.11
  targetNamespace: argocd
  createNamespace: true
  valuesContent: |-
    global:
      nodeSelector:
        role: head
    configs:
      params:
        server.insecure: true
        server.disable.auth: true
    server:
      service:
        type: NodePort
        nodePortHttp: 30080
      ingress:
        enabled: true
        ingressClassName: traefik
        hostname: argo.robodatalab.com
        extraTls:
          - hosts:
              - argo.robodatalab.com
            secretName: robodatalab-wildcard-tls
    notifications:
      enabled: true
---
# Both bootstrap Applications are declared here so the deployment list per
# profile is visible at a glance. K3sServer detects sys_vendor at install time
# and deletes the Application that does not match the profile before applying
# this manifest -- exactly one of the two is ever staged into the cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-bootstrap-aws
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/robodatalab/robolab-infra.git
    targetRevision: main
    path: k8s/argo_deployments/aws
    directory:
      # Bootstrap applies every *.yaml at the top level. Each top-level file
      # is an Application; subdirs are owned by those Applications. Adding a
      # new aggregator never requires editing this file.
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-bootstrap-onprem
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/robodatalab/robolab-infra.git
    targetRevision: main
    path: k8s/argo_deployments/onprem
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
