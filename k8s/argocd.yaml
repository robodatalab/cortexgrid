apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: argocd
  namespace: kube-system
spec:
  chart: argo-cd
  repo: https://argoproj.github.io/argo-helm
  version: 9.5.11
  targetNamespace: argocd
  createNamespace: true
  # Minimal bootstrap values. Real config lives in the self-managing Argo
  # Application at k8s/argo_deployments/<profile>/argocd.yaml -- after first
  # sync it overrides everything here. Only keep what is needed for the
  # initial pods to schedule on the right node.
  valuesContent: |-
    global:
      nodeSelector:
        role: head
---
# Both bootstrap Applications are declared here so the deployment list per
# profile is visible at a glance. K3sServer detects sys_vendor at install time
# and deletes the Application that does not match the profile before applying
# this manifest -- exactly one of the two is ever staged into the cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-bootstrap-aws
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/robodatalab/robolab-infra.git
    targetRevision: main
    path: k8s/argo_deployments/aws
    # kustomization.yaml at this path renders the base Application list plus
    # profile-specific patches and resources. Adding a new shared Application
    # is done in base/; profile-specific Applications go alongside this file.
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-bootstrap-onprem
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/robodatalab/robolab-infra.git
    targetRevision: main
    path: k8s/argo_deployments/onprem
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
