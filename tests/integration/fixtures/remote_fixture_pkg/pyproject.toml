[project]
name = "remote-fixture-pkg"
version = "0.1.0"
requires-python = ">=3.11"
# cortexflow is provided by the test image's own environment and ships with the
# remote job, so it is intentionally not declared here (declaring it would make
# the fixture's git install pull the private cortexflow source during build).
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["remote_fixture"]

# Ship the runtime data file inside the wheel so it lands in site-packages.
[tool.hatch.build.targets.wheel.force-include]
"remote_fixture/manifest.json" = "remote_fixture/manifest.json"
